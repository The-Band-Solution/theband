# ═══════════════════════════════════════════════════════════════════════════════
# CD — feature 050, contrato em specs/050-em-producao/contracts/pipeline-de-release.md.
#
# Gitflow (constituição 1.7.0): a main só recebe merge do PR de release vindo de
# development, aberto sob decisão do Product Owner — e TODO merge nela é deploy.
# Este workflow é a consequência mecânica: versão do mix.exs → imagem no ghcr →
# tag git → webhook do Dokploy. Sem suíte de testes aqui — o PR de release já
# passou pelos 14 gates no CI; o que este workflow valida é o que só ele produz.
#
# Idempotente por versão: re-executar sobre versão já publicada reporta e sai
# verde, sem republicar nem re-entregar.
# ═══════════════════════════════════════════════════════════════════════════════
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: write # a tag git vX.Y.Z nasce do merge
  packages: write # ghcr.io

env:
  IMAGEM: ghcr.io/the-band-solution/theband

jobs:
  release:
    name: imagem, tag e delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # as tags existentes decidem o passo 1

      - name: a versão vem do mix.exs, e versão repetida FALHA nomeando
        id: versao
        run: |
          VERSAO=$(grep -o 'version: "[^"]*"' mix.exs | head -1 | cut -d'"' -f2)
          test -n "$VERSAO" || { echo "mix.exs sem version — nada a publicar" >&2; exit 1; }
          echo "versao=v$VERSAO" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSAO" > /dev/null; then
            if [ "$(git rev-parse "refs/tags/v$VERSAO^{commit}")" = "$GITHUB_SHA" ]; then
              echo "ja_publicada=true" >> "$GITHUB_OUTPUT"
              echo "v$VERSAO já aponta para este commit — idempotência: nada a refazer."
            else
              echo "A tag v$VERSAO JÁ EXISTE em outro commit. Versão não se reusa:" >&2
              echo "o PR de release precisa de um bump novo no mix.exs." >&2
              exit 1
            fi
          else
            echo "ja_publicada=false" >> "$GITHUB_OUTPUT"
          fi

      - name: login no ghcr
        if: steps.versao.outputs.ja_publicada == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AS DUAS TAGS CONTINUAM — e o achado H7 se fecha do outro lado.
      #
      # `latest` não identifica nada: aponta para a última publicação, e "a última" muda sem
      # que nenhum registro mude junto. A tentação é parar de publicá-la — e seria **pior**:
      # a aplicação no Dokploy declara qual imagem puxa, essa declaração vive lá e não aqui, e
      # tirar a tag faria a próxima release **não implantar** enquanto o webhook continuasse
      # respondendo `deployed successfully`. Trocaria uma lacuna de verificação por uma queda
      # silenciosa, que é a família de defeito que esta casa mais combate.
      #
      # O que fecha o achado é **poder verificar**, e é o passo `a produção confirma a versão`
      # abaixo: depois do delivery, a CD pergunta à produção qual versão ela está servindo e
      # **falha** se não for esta. Com ele, `latest` deixa de ser uma afirmação sem prova.
      - name: build e publicação da imagem
        if: steps.versao.outputs.ja_publicada == 'false'
        run: |
          docker build -t "$IMAGEM:${{ steps.versao.outputs.versao }}" -t "$IMAGEM:latest" . \
            > build.log 2>&1; EXIT=$?
          tail -30 build.log
          echo "EXIT=$EXIT"
          [ $EXIT -eq 0 ] || exit $EXIT
          docker push "$IMAGEM:${{ steps.versao.outputs.versao }}"
          docker push "$IMAGEM:latest"

      - name: a tag git nasce do merge
        if: steps.versao.outputs.ja_publicada == 'false'
        run: |
          git config user.name "the-band-cd"
          git config user.email "cd@users.noreply.github.com"
          git tag -a "${{ steps.versao.outputs.versao }}" -m "Release ${{ steps.versao.outputs.versao }} — registro em docs/releases/" "$GITHUB_SHA"
          git push origin "${{ steps.versao.outputs.versao }}"

      - name: delivery no Dokploy — resposta não-2xx FALHA
        if: steps.versao.outputs.ja_publicada == 'false'
        run: |
          if [ -z "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "DOKPLOY_WEBHOOK_URL ausente nos Secrets — a imagem e a tag existem," >&2
            echo "mas NÃO houve delivery. O runbook §2 diz onde configurar." >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
          echo "webhook aceito — o Dokploy reimplanta a imagem que a aplicação dele declara."

      # A PRODUÇÃO CONFIRMA A VERSÃO — e é isto que fecha o H7.
      #
      # Antes deste passo, o delivery terminava em `deployed successfully` e **nada provava**
      # que o container subiu a versão do merge: `latest` responde *"o que foi publicado por
      # último"*, que não é a mesma pergunta. Em toda release desta sessão foi preciso escrever
      # a ressalva à mão, porque não havia como medir.
      #
      # Agora a CD **pergunta à produção** e falha quando a resposta não é esta versão. Falhar
      # é o ponto: um delivery que não chegou tem de parecer um delivery que não chegou.
      #
      # A espera é por tentativas e não por `sleep` fixo — o container leva de segundos a um
      # par de minutos para subir, e um número fixo ou espera demais em todo release ou de
      # menos justamente no que falhar.
      - name: a produção confirma a versão — resposta diferente FALHA
        if: steps.versao.outputs.ja_publicada == 'false'
        env:
          ENDERECO: ${{ secrets.PRODUCAO_URL }}
          ESPERADA: ${{ steps.versao.outputs.versao }}
        run: |
          if [ -z "$ENDERECO" ]; then
            echo "PRODUCAO_URL ausente nos Secrets — o delivery aconteceu e NÃO foi" >&2
            echo "verificado. É o achado H7 em aberto: sem endereço, 'está no ar' é" >&2
            echo "afirmação sem prova. Configure o Secret; o runbook §2 diz onde." >&2
            exit 1
          fi

          for tentativa in $(seq 1 30); do
            VERSAO=$(curl --silent --max-time 10 "$ENDERECO/version" | tr -d '[:space:]' || true)
            if [ "$VERSAO" = "$ESPERADA" ]; then
              echo "a produção serve $VERSAO — igual à publicada."
              exit 0
            fi
            echo "tentativa $tentativa/30: a produção responde '${VERSAO:-nada}', esperado $ESPERADA"
            sleep 10
          done

          echo "A PRODUÇÃO NÃO CONFIRMOU $ESPERADA em cinco minutos." >&2
          echo "A imagem e a tag existem; o webhook foi aceito; e o que está servindo" >&2
          echo "NÃO é esta versão. Ver o achado H7 e o runbook §7 (rollback)." >&2
          exit 1
