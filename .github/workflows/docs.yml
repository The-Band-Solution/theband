# ═══════════════════════════════════════════════════════════════════════════════
# Publica o site da documentação em https://theband.dev/developers/
#
# ⚠️ A `gh-pages` NÃO é deste site sozinha. Ela serve a landing page em
# `index.html` (53 KB) e carrega o `CNAME` do domínio. Por isso:
#
#   • `mkdocs gh-deploy` NUNCA é usado — ele APAGA a branch inteira;
#   • a publicação escreve em `developers/` e, desde a 075, também o `404.html` da
#     raiz (Q4 do protótipo, decisão de 2026-10-03) — só esse arquivo, por `cp`
#     dele e de nenhum outro;
#   • o passo de guarda aborta se o `CNAME`, o `index.html` da raiz, a página do
#     produto em `/docs/` ou o `404.html` sumirem, se a 404 publicada não for a
#     construída, e se a seção Segurança voltar a ser publicada (E1, E2, E7 da
#     avaliação de segurança da 075).
#
# O guarda existe porque um deploy que destrói o domínio não dá erro: ele
# publica com sucesso um site sem CNAME, e o domínio cai em silêncio. É a
# família do sucesso silencioso, e aqui ela custaria o endereço do produto.
# ═══════════════════════════════════════════════════════════════════════════════
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'scripts/mkdocs_hooks.py'
      - 'scripts/verificar_links_do_site.py'
      - 'overrides/**'
      - 'mkdocs-dados/**'
      - 'test/site/**'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  # Permite publicar sem esperar um push — útil depois de mexer na gh-pages à mão.
  workflow_dispatch:

permissions:
  contents: write # o push na gh-pages

concurrency:
  group: docs-pages
  cancel-in-progress: false # publicação não se cancela no meio

jobs:
  publicar:
    name: construir e publicar em /developers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # O commit do build aparece na página (git log -1); a credencial não fica
          # guardada no checkout: o push na gh-pages usa o token só no clone abaixo.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: dependências fixadas
        run: pip install --require-hashes -r requirements-docs.txt

      - name: construir — MODO ESTRITO
        # `--strict` transforma link quebrado em falha de build. Não é rigor
        # decorativo: foi ele que encontrou 118 links quebrados que ninguém via,
        # inclusive no GitHub. Sem ele o site publica os 404 em silêncio.
        run: mkdocs build --strict

      - name: varredura de links do site construído
        run: python3 scripts/verificar_links_do_site.py site

      - name: testes do site construído
        env:
          SITE_DIR: site
        run: python3 -m unittest discover -s test/site -t test/site

      - name: publicar em gh-pages/developers, preservando a raiz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publicacao

          # Só a subpasta é substituída. A raiz não é tocada por comando nenhum.
          rm -rf publicacao/developers
          cp -r site publicacao/developers
          # A 404 da raiz vale para todo theband.dev (5.1). É o único arquivo que este
          # workflow escreve fora de developers/.
          cp site/404.html publicacao/404.html

          # ── O GUARDA ──
          # Um deploy que perdeu o CNAME publica com sucesso e derruba o domínio
          # sem erro nenhum. Conferir é mais barato que descobrir.
          test -f publicacao/CNAME || { echo "::error::CNAME sumiu da gh-pages — abortando"; exit 1; }
          test -f publicacao/index.html || { echo "::error::index.html da raiz sumiu — abortando"; exit 1; }
          test -f publicacao/developers/index.html || { echo "::error::o site não gerou developers/index.html"; exit 1; }
          # `/docs/` deixou de ser este site e passou a ser a página do produto,
          # mantida à mão na raiz da `gh-pages`. Se ela sumir, o deploy "funciona"
          # e um dos endereços que a landing anuncia cai sem erro nenhum — a mesma
          # família do sucesso silencioso que o guarda do CNAME já cobre.
          test -f publicacao/docs/index.html || { echo "::error::a página do produto em /docs/ sumiu — abortando"; exit 1; }
          test -f publicacao/404.html || { echo "::error::a 404 da raiz não foi escrita — abortando"; exit 1; }
          cmp site/404.html publicacao/404.html || { echo "::error::a 404 da raiz não é a construída — abortando"; exit 1; }
          # E1/E2: a seção Segurança saiu do site; se voltar, é regressão de exposição.
          test ! -e publicacao/developers/seguranca || { echo "::error::developers/seguranca foi publicado — abortando"; exit 1; }

          echo "CNAME preservado: $(cat publicacao/CNAME)"

          cd publicacao
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "nada mudou no site — nada a publicar"
            exit 0
          fi

          git commit -m "docs: site atualizado a partir de ${GITHUB_SHA}"
          git push

      - name: onde ficou
        run: echo "### Site publicado em https://theband.dev/developers/" >> "$GITHUB_STEP_SUMMARY"
