name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test
  # `THE_BAND_MASTER_KEY` **não** é declarada aqui, de propósito.
  #
  # `config/runtime.exs` já fornece uma chave fixa e assumidamente pública quando
  # `config_env() == :test`: em CI ela cifra apenas dados de fixture em um banco
  # descartado no fim da execução, e nada precisa sobreviver entre execuções.
  #
  # A versão anterior referenciava `secrets.THE_BAND_MASTER_KEY`. Com o secret não
  # cadastrado, a variável chegava como **string vazia** em vez de ausente, e isso
  # desligava o fallback de teste: a aplicação recusava o boot e `mix test` falhava
  # sem que houvesse nada de errado com o código. Referenciar um secret que não
  # existe é pior que não referenciar nenhum.
  #
  # A chave real continua fora do repositório e fora do workflow — FR-005,
  # constituição princípio III.

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_band_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29"

      - name: Cache de dependências e PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # ------------------------------------------------------------------------
      # Os nove gates da constituição, princípio VII. Nenhum é opcional, e nenhum
      # pode ser desabilitado para o pipeline passar.
      # Um passo, e a definição dos gates vive em `mix gates`.
      #
      # Antes eram nove passos com o comando de cada um escrito aqui, e a lista do
      # README era uma décima cópia. As três divergiram: rodar os gates localmente
      # pulava a validação de FORMA dos YAML, porque o venv só existia no CI. O
      # resultado era verde falso local e reprovação aqui — L23.
      #
      # Com uma definição só, a paridade não pode apodrecer sem alguém notar: quem
      # roda `mix gates` roda o que este passo roda, incluindo o provisionamento do
      # venv. E `act` executa este workflow na máquina, o que fecha o círculo.
      #
      # O que se perde: a granularidade por passo na interface do GitHub. O que se
      # ganha: não existir um segundo lugar onde a lista pode ficar desatualizada.
      # ------------------------------------------------------------------------
      - name: nove quality gates
        run: mix gates
