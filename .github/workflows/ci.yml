name: CI

on:
  # **Toda branch, e não só a `main`.** A análise existe para pegar o que entra enquanto ainda
  # é barato mudar — esperar o PR é esperar a decisão já estar tomada.
  push:
  pull_request:

env:
  MIX_ENV: test
  # `THE_BAND_MASTER_KEY` **não** é declarada aqui, de propósito.
  #
  # `config/runtime.exs` já fornece uma chave fixa e assumidamente pública quando
  # `config_env() == :test`: em CI ela cifra apenas dados de fixture em um banco
  # descartado no fim da execução, e nada precisa sobreviver entre execuções.
  #
  # A versão anterior referenciava `secrets.THE_BAND_MASTER_KEY`. Com o secret não
  # cadastrado, a variável chegava como **string vazia** em vez de ausente, e isso
  # desligava o fallback de teste: a aplicação recusava o boot e `mix test` falhava
  # sem que houvesse nada de errado com o código. Referenciar um secret que não
  # existe é pior que não referenciar nenhum.
  #
  # A chave real continua fora do repositório e fora do workflow — FR-005,
  # constituição princípio III.

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_band_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29"

      - name: Cache de dependências e PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # ------------------------------------------------------------------------
      # O binário do Tailwind e do esbuild, cacheados **pela versão deles** — issue #232.
      #
      # O cache acima é chaveado por `mix.lock`, e é o certo para as dependências. Mas o
      # binário do Tailwind não tem nada a ver com `mix.lock`: mudar uma dependência Elixir
      # invalida o cache e força baixar o binário de novo — e uma falha de rede de um instante
      # reprova a execução inteira, inclusive os gates que já tinham passado.
      #
      # A chave é a versão declarada em `config/config.exs`. **Repetir a tentativa foi recusado
      # na issue**: mascararia a diferença entre rede instável e origem indisponível, que é
      # justamente a distinção que o produto passou a fazer na feature 009.
      # ------------------------------------------------------------------------
      - name: Cache dos binários de assets
        uses: actions/cache@v4
        with:
          path: |
            _build/tailwind-*
            _build/esbuild-*
          key: ${{ runner.os }}-assets-${{ hashFiles('config/config.exs') }}

      # ------------------------------------------------------------------------
      # Os dez gates da constituição, princípio VII. Nenhum é opcional, e nenhum
      # pode ser desabilitado para o pipeline passar.
      # Um passo, e a definição dos gates vive em `mix gates`.
      #
      # Antes eram nove passos com o comando de cada um escrito aqui, e a lista do
      # README era uma décima cópia. As três divergiram: rodar os gates localmente
      # pulava a validação de FORMA dos YAML, porque o venv só existia no CI. O
      # resultado era verde falso local e reprovação aqui — L23.
      #
      # Com uma definição só, a paridade não pode apodrecer sem alguém notar: quem
      # roda `mix gates` roda o que este passo roda, incluindo o provisionamento do
      # venv. E `act` executa este workflow na máquina, o que fecha o círculo.
      #
      # O que se perde: a granularidade por passo na interface do GitHub. O que se
      # ganha: não existir um segundo lugar onde a lista pode ficar desatualizada.
      # ------------------------------------------------------------------------
      - name: dez quality gates
        run: mix gates

  # --------------------------------------------------------------------------
  # A análise externa, e ela **não** é o décimo primeiro gate.
  #
  # Os gates decidem se o código entra e vivem em `mix gates`, que roda offline. Este
  # trabalho depende de rede e de um token que não está no repositório: transformá-lo em
  # gate faria indisponibilidade de terceiro reprovar código correto.
  #
  # `continue-on-error` é de propósito, e é a razão pela qual ele não bloqueia. O que ele
  # **não** faz é esconder: o passo de conferência abaixo falha quando os relatórios não
  # existem, porque painel que mostra 0% sem dizer que não achou o arquivo afirma qualidade
  # que ninguém mediu.
  # --------------------------------------------------------------------------
  sonarcloud:
    runs-on: ubuntu-latest
    needs: quality-gates
    # Sem o token, o passo falharia em toda execução de quem abrir um fork — e o vermelho
    # constante treina a ignorar. Ausência de segredo é ausência de análise, declarada.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: the_band_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # O Sonar precisa do histórico para atribuir cada linha a um commit — sem ele,
          # "código novo" vira "todo o código", e o painel cobra dívida antiga como se
          # tivesse nascido agora.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29"

      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # ------------------------------------------------------------------------
      # O binário do Tailwind e do esbuild, cacheados **pela versão deles** — issue #232.
      #
      # O cache acima é chaveado por `mix.lock`, e é o certo para as dependências. Mas o
      # binário do Tailwind não tem nada a ver com `mix.lock`: mudar uma dependência Elixir
      # invalida o cache e força baixar o binário de novo — e uma falha de rede de um instante
      # reprova a execução inteira, inclusive os gates que já tinham passado.
      #
      # A chave é a versão declarada em `config/config.exs`. **Repetir a tentativa foi recusado
      # na issue**: mascararia a diferença entre rede instável e origem indisponível, que é
      # justamente a distinção que o produto passou a fazer na feature 009.
      # ------------------------------------------------------------------------
      - name: Cache dos binários de assets
        uses: actions/cache@v4
        with:
          path: |
            _build/tailwind-*
            _build/esbuild-*
          key: ${{ runner.os }}-assets-${{ hashFiles('config/config.exs') }}

      # A suíte lê o CSS compilado — há teste que confere se a paleta chega ao arquivo final.
      # Sem este passo, `mix qa.reports` roda os testes sem os assets e reprova um teste que
      # passa no trabalho de gates, que constrói. Aconteceu na primeira execução deste CI.
      - name: Construir assets
        run: mix assets.build

      - name: Relatórios que o Sonar importa
        run: mix qa.reports

      - name: Conferir que os relatórios existem
        run: |
          test -s cover/excoveralls.xml || { echo "cobertura ausente — o painel mostraria 0%"; exit 1; }
          test -s cover/credo.json || { echo "achados do Credo ausentes"; exit 1; }

      # ------------------------------------------------------------------------
      # **Segredo ausente é erro de configuração, e não indisponibilidade de terceiro.**
      #
      # A primeira versão deste trabalho não distinguia os dois: com `SONAR_TOKEN` vazio, o
      # scanner falhava, o `continue-on-error` engolia, e o trabalho ficava **verde com zero
      # análises no painel**. Foi assim que aconteceu — o próprio agente de QA existe para
      # caçar esse padrão, e ele apareceu no código que o criou.
      #
      # A distinção é a mesma que o produto faz desde a feature 009: falha transitória não é
      # tratada como permanente, e ausência de configuração não é tratada como falha de rede.
      # ------------------------------------------------------------------------
      - name: Conferir que o segredo existe
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN não está cadastrado — a análise não aconteceu, e nenhum painel foi atualizado."
            echo "Cadastre em Settings → Secrets and variables → Actions, ou:"
            echo "  gh secret set SONAR_TOKEN -R The-Band-Solution/theband"
            exit 1
          fi

      - name: SonarCloud
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
