# ═══════════════════════════════════════════════════════════════════════════════
# MkDocs — o site da documentação do The Band.
#
# ATENÇÃO AO DEPLOY. A branch `gh-pages` NÃO está vazia: ela serve
# https://theband.dev com um `index.html` de 53 KB e um `CNAME`. `mkdocs gh-deploy`
# APAGA a branch inteira — a landing page e o domínio junto.
#
# Por isso o site é publicado em `theband.dev/developers/` por um workflow que preserva
# o que já existe na raiz. Ver `.github/workflows/docs.yml`, e nunca rodar
# `mkdocs gh-deploy` neste repositório.
# ═══════════════════════════════════════════════════════════════════════════════

site_name: The Band — Documentação
site_description: >-
  Integração semântica de dados de Engenharia de Software: coleta das ferramentas,
  harmonização contra ontologias de referência, proveniência preservada.
site_url: https://theband.dev/developers/
repo_url: https://github.com/The-Band-Solution/theband
repo_name: The-Band-Solution/theband
edit_uri: edit/development/docs/
copyright: The Band — base científica na tese de Paulo Sérgio dos Santos Júnior (UFES, 2023)

docs_dir: docs
site_dir: site

theme:
  name: material
  # O tema de theband.dev sobre o Material (075). Os parciais em overrides/ são a
  # régua do protótipo aprovado em docs/site-developers/prototipo/.
  custom_dir: overrides
  language: pt-BR
  # Nenhuma webfont: a landing não faz requisição a terceiro, e este site também
  # não (AC11). As famílias são as do sistema, em theband.css.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    # Sem `navigation.instant`: com ele, o seletor de idioma do plugin não leva à
    # mesma página no outro idioma (aviso do mkdocs-static-i18n, 2026-10-03).
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # O tema segue o do sistema, e os dois botões permitem escolher.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Seguir o sistema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro

markdown_extensions:
  - tables                    # 105 dos 110 arquivos usam tabela
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
      # O slug do GitHub, e não o do MkDocs. Os documentos foram escritos para
      # serem lidos no GitHub e têm centenas de links internos com o formato
      # dele — "— " vira dois hífens, e o padrão do MkDocs faz um só. Sem isto,
      # 154 âncoras quebram só em `licoes-aprendidas.md`.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# A identidade, o Mermaid servido pelo site e o comportamento das tabelas (075).
extra_css:
  - assets/stylesheets/theband.css
extra_javascript:
  - assets/javascripts/theband.js

extra:
  identidade:
    # A data em que os tokens foram copiados de gh-pages:index.html (#1267 D3).
    copiada_em: 2026-10-03
  links:
    landing: https://theband.dev/
    produto: https://theband.dev/docs/
    plataforma: https://app.theband.dev/sign-in
    github: https://github.com/The-Band-Solution/theband
    github_docs: https://github.com/The-Band-Solution/theband/tree/development/docs
  mermaid:
    # Mermaid 11.17.2 do npm, tarball conferido contra o dist.integrity do registro
    # (research.md, R2). O hook reprova o build se o arquivo não tiver este sha256.
    arquivo: assets/javascripts/vendor/mermaid-11.17.2.min.js
    sha256: 581ed7d74bd9048d0e3a91363927d72ef22942d7722546b27f7cc29e35390eb8
  traducao:
    # Fica false até o último lote de traducao.md; depois, página PT sem EN reprova.
    exigir: false

# O que não é publicado (avaliação de segurança da 075, E1 e E3). O repositório é
# público: excluir reduz o alcance, não desfaz a exposição. Links para o que está
# aqui vão ao GitHub, pelo hook.
exclude_docs: |
  seguranca/
  producao/prototipo-fila-parada/seguranca.md
  *.txt
  *.log
  *.sql
  *.dump
  *.env*

# Página fora da navegação reprova (Q7, opção 1): com `--strict`, o aviso é falha.
# Só os protótipos ficam fora de propósito.
validation:
  nav:
    omitted_files: warn
not_in_nav: |
  site-developers/prototipo/
  producao/prototipo-fila-parada/

plugins:
  - search:
      lang: pt
  # O site inteiro em PT (padrão) e EN (decisão de 2026-10-03). A tradução fica ao
  # lado do original, `pagina.en.md`; a página sem tradução é servida com a
  # ausência nomeada (traducao.md). Dependência nova: plan.md.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          default: true
          name: Português
          build: true
        - locale: en
          name: English
          build: true
          site_name: The Band — Developer docs
          nav_translations:
            Início: Home
            Arquitetura: Architecture
            Visão geral: Overview
            Modelo de dados: Data model
            Modelos: Models
            Funcionalidades: Features
            O que o produto faz: What the product does
            Ontologias: Ontologies
            Dados externos: External data
            Medidas: Measures
            Decisões: Decisions
            Operação: Operations
            Segurança: Security
            Sprints: Sprints
            # L02 (075/T028): ontologias e decisões.
            Rede de ontologias: Ontology network
            Índice de conceitos: Concept index
            EO — organização e pessoas: EO — organization and people
            SPO — projetos: SPO — projects
            SRO — processo e trabalho: SRO — process and work
            CMPO — mudanças: CMPO — changes
            CMO — configuração: CMO — configuration
            CDRO — dependências: CDRO — dependencies
            CIRO — integração contínua: CIRO — continuous integration
            RSRO — release: RSRO — release
            QAPO — qualidade: QAPO — quality
            SMPO — medição: SMPO — measurement
            ROoST — testes: ROoST — testing
            OSDeF — código: OSDeF — code
            UFO — fundamentação: UFO — foundations
            SysSwO — sistema e software: SysSwO — system and software
            0001 monolito modular elixir: 0001 modular monolith in Elixir
            0002 yaml como base de conhecimento: 0002 YAML as the knowledge base
            0003 organizacao por ontologias: 0003 organization by ontologies
            0004 modelo de informacao one table per kind: 0004 information model, one table per kind
            0005 telemetria da jornada: 0005 journey telemetry
            0006 coleta paralela: 0006 parallel collection
            0007 gestor de cotas: 0007 quota manager
            0008 vinculo observado: 0008 observed team membership
            0009 API pública com token: 0009 public API with a token
            0010 hash do token de API: 0010 API token hash

