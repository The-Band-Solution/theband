measurement:
  id: review.network.unconnected_groups.count
  name:
    pt-BR: "Grupos de pessoas que não se revisam entre si, e o tamanho de cada um"
    en: "Groups of people who do not review each other, and the size of each"
  answers_information_need: [review.concentration]
  value_type: count
  unit: groups

  formula:
    expression: >
      Seja P o conjunto de pessoas no alcance de quem consulta (para quem administra, todas
      as pessoas da organização observada O). Seja G o grafo dirigido da leitura (O, janela
      W) RECORTADO por P, como a concentração (decidido em 2026-10-03, Q4): nós = pessoas de
      P com AO MENOS UMA aresta para outra pessoa de P, e arestas = revisor → autor com
      weight > 0, as duas pontas em P. Ignora-se a direção (componentes FRACAMENTE
      conexos):
        groups      = número de componentes fracamente conexos de G     [grupos]
        size(g)     = número de pessoas no componente g                 [pessoas]
      Pessoa sem aresta NÃO é nó, e por isso não é grupo de tamanho 1 (R2 item 4). Todo
      componente tem ao menos 2 pessoas.
      Se G não tem aresta: AUSENTE com o motivo `no_review_in_window`, nunca 0.
      Quem está fora do alcance não entra em grupo nenhum, e por isso nenhum tamanho fala
      de quem quem consulta não alcança. O mínimo de grupo
      (review.network.parameters.min_group_size_shown) não tem caso nesta fatia.
    inputs:
      [review_edge_reviewer_person_id, review_edge_author_person_id, review_edge_weight,
       window_start, window_end, observed_organization_id, viewer_reach]

  scope:
    levels: [observed_organization]
    filters:
      - "o cálculo é sobre o recorte pelo alcance de quem consulta, o mesmo da concentração (Q4, decidido em 2026-10-03); quem administra lê a organização inteira"
      - "direção ignorada: dois grupos estão separados quando não há revisão em sentido nenhum entre eles"
      - "nenhum integrante é nomeado por esta medida; os nomes, quando aparecem, vêm da lista por pessoa, sob o alcance"
    period: "janela móvel de 30, 90 ou 180 dias, padrão 90 (review.network.parameters.window_days)"

  limitations:
    - "Componente FRACO, e não forte: A revisou B e B nunca revisou A já os põe no mesmo grupo. A pergunta é 'há caminho de revisão entre os dois grupos, em qualquer sentido?', e não 'há reciprocidade?'."
    - "A janela decide o grupo. Dois grupos separados em 30 dias podem estar ligados em 90; a leitura vale para a janela que declara, e a tela a escreve ao lado."
    - "Grupo não é equipe e não é comunidade. É só o conjunto de pessoas ligadas por revisão na janela; comparar com as equipes declaradas é a fatia 2, e não esta medida (FR-019)."
    - "Para quem tem alcance parcial, dois colegas podem aparecer em grupos separados só porque a pessoa que os liga está fora do alcance. O grupo é da rede que quem consulta alcança, e não da organização."
    - "Pessoas sem aresta na janela não estão em grupo nenhum. A contagem delas, quando aparece, é sobre as pessoas alcançáveis por quem consulta (R2 item 5)."

  misinterpretations:
    - "Ler grupo isolado como silo, ou como problema. Pode ser um produto separado de propósito, um repositório com equipe própria, ou um projeto que acabou."
    - "Ler um grupo só como 'todos se revisam'. Um grupo de 14 pode ser uma estrela: uma pessoa revisando 13 que não se revisam entre si. A concentração diz isso; o número de grupos, não."
    - "A medida não avalia nenhuma pessoa, e estar num grupo pequeno não é isolamento da pessoa."
    - "Comparar o número de grupos entre janelas de tamanhos diferentes como tendência. Janela maior junta mais arestas e tende a ter menos grupos sem que nada tenha mudado."

  provenance:
    source_type: project_decision
    year: 2026
    reference: "spec 073, US3, FR-007 (terceiro item), FR-008; seguranca.md R2 itens 3 e 4"
    note: >
      Adapta a contagem de componentes da referência
      (`dashboard_team_graph.py:277-282`), que testa conectividade FORTE e reporta
      componentes FRACOS na mesma frase — por isso o relatório publicado diz "o grafo é
      desconexo, contendo 1 componentes". Aqui só existe o critério fraco, declarado.
