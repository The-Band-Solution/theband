derivation_rule:
  id: review.network.parameters
  version: 1
  provider: platform
  status: proposed
  confidence: medium

  name:
    pt-BR: "Os parâmetros da rede de revisão — janelas, k, amostra mínima e grupo mínimo"

  description:
    pt-BR: >
      A rede de revisão (spec 073) depende de quatro decisões numéricas. Cada uma muda o que
      a plataforma afirma sobre pessoas: a janela decide quem
      aparece, o k decide quanto da concentração se diz, a amostra mínima decide quando a
      concentração pode ser dita, e o grupo mínimo decide quando um tamanho deixa de apontar
      para duas pessoas.

      Moram aqui, e não em constante de módulo, pela razão de `team.dashboard.thresholds` e
      `profile.thresholds`: em constante, o número muda num diff de código e ninguém percebe
      que a plataforma passou a afirmar outra coisa (spec 073, FR-008).

      O que vira aresta — os estados que contam e a ordem das exclusões — NÃO mora aqui: é
      significado, e está em `review.network.edge` (revisão semântica 073/T003). Estes
      parâmetros mudam quando a apresentação muda; aquela regra, quando o significado muda.

      **Nenhum destes números é faixa de classificação de pessoa.** A referência que motivou a
      feature classifica pessoas por percentil (80, 50, 30) e redes por faixas (0,3; 0,7) sem
      razão escrita (`dashboard_team_graph.py:308`, `:354`, `:404`, `:497-507`). Aqui não há
      limiar que transforme número em rótulo: cada valor decide **se** algo é dito, nunca
      **o que** uma pessoa é.

  provenance:
    source_type: project_decision
    year: 2026
    reference: >
      spec 073, FR-008, FR-013 e Assumptions; seguranca.md R2 e R6; decisões
      da pessoa mantenedora de 2026-10-03 (R1, R2, R4, R6, R7)
    note: >
      PROPOSTA, ainda fora de `priv/knowledge_base/`. Janelas e padrão vêm da spec (FR-013)
      e foram confirmados na decisão de R6. O k e a amostra mínima vêm das Assumptions da
      spec. O grupo mínimo nasceu da sugestão da avaliação de segurança (R2 item 3), e foi
      decidido pela pessoa mantenedora em 2026-10-03 (3). Nenhum valor foi
      medido contra o banco: o volume real em 180 dias é pergunta aberta do plano
      (seguranca.md, "O que eu NÃO verifiquei").

  rules:
    window_days:
      name:
        pt-BR: "As janelas permitidas são 30, 90 e 180 dias; o padrão é 90"
      statement:
        pt-BR: >
          A leitura existe para exatamente três janelas, calculadas juntas ao fim da coleta de
          revisões. Valor fora da lista é **recusado no domínio** — não arredondado para a
          mais próxima, nem convertido de texto livre (R6; cenário A8 da avaliação de
          segurança).
      note:
        pt-BR: >
          **30** é o horizonte de uma redistribuição de revisão: o que aconteceu no último mês
          é o que se muda no próximo. **90** é o padrão porque cobre ausências comuns — férias
          de duas a três semanas — sem que uma pessoa ausente apareça como quem não revisa; com
          30, uma ausência de três semanas domina a leitura. **180** existe para ver se a
          concentração é estrutural ou episódica: se ela persiste em seis meses, não é efeito
          de uma ausência.

          A base não declara janela para as medidas de fluxo, que se recortam por sprint; a
          revisão não tem sprint (é ato sobre solicitação, não item de backlog), e por isso a
          janela é móvel e declarada aqui.
      values:
        allowed: [30, 90, 180]
        default: 90

    k_values:
      name:
        pt-BR: "A concentração é dita para as uma, duas e três pessoas que mais revisaram"
      statement:
        pt-BR: >
          `review.network.concentration.top_k_share` é calculada para k = 1, 2 e 3, e para
          nenhum outro k. k maior que o número de revisores dá medida ausente, e não 100%.
      note:
        pt-BR: >
          A decisão que a medida apoia é *"se uma ou duas pessoas faltarem, a revisão para?"*.
          k = 1 responde à ausência de uma pessoa; k = 2 e 3 à de um par ou trio, que é o
          tamanho típico de quem revisa por designação num repositório. Acima de 3 a pergunta
          deixa de ser sobre dependência de poucas pessoas e vira distribuição — e uma curva
          completa de concentração (Lorenz, Gini) induziria a ler a lista inteira em ordem,
          que é o ranking recusado (FR-018a).
      values:
        k: [1, 2, 3]

    min_reviews:
      name:
        pt-BR: "A concentração só é dita com ao menos 10 revisões na janela"
      statement:
        pt-BR: >
          Com menos de **10** revisões (pares revisor–solicitação, a unidade do denominador)
          entre as pessoas que entram no cálculo (a organização inteira para quem administra; as alcançadas, para alcance
          parcial), a concentração é **ausente com o motivo `sample_below_minimum`**, e a tela
          diz o mínimo. As contagens por pessoa e os grupos continuam aparecendo.
      note:
        pt-BR: >
          A razão é aritmética. Com R revisões no denominador e a revisões de uma pessoa, uma
          revisão a mais dela leva a fração de a/R para (a+1)/(R+1): a mudança é
          (R − a) / (R(R + 1)), cujo máximo é 1/(R + 1). Com R ≥ 10 a mudança é de no máximo
          1/11 ≈ 9,1 pontos; com R = 9 chega a 10 pontos, e com menos, a mais. Uma fração que
          uma única revisão desloca em dez pontos não sustenta a palavra "concentrada".

          **Decidido pela pessoa mantenedora em 2026-10-03**: o critério e a conta estão na
          mesma unidade, revisões, e abaixo do mínimo a concentração é AUSENTE com motivo
          (como `flow.completion.forecast`, que não produz previsão abaixo do piso); as
          contagens aparecem. A spec foi corrigida no mesmo dia.
      values:
        min_reviews: 10
        below_minimum: absent

    min_group_size_shown:
      name:
        pt-BR: "Grupo com menos de 3 pessoas não tem o tamanho mostrado a quem não alcança todas"
      statement:
        pt-BR: >
          Um grupo com menos de **3** pessoas, cujos integrantes quem consulta não alcança
          todos, não tem o tamanho mostrado. **Decidido em 2026-10-03: 3.** Nesta fatia a
          regra não tem caso: com a Q4, `review.network.unconnected_groups.count` é calculada
          só entre as pessoas alcançadas, e todo integrante de todo grupo é alcançado. Fica
          declarada para a fatia 2 (comunidades), que a reusa.
      note:
        pt-BR: >
          Pessoa sem aresta não é nó (R2 item 4), então todo grupo tem ao menos 2 pessoas, e o
          único tamanho que este mínimo esconde é **2**. Um grupo de 2 isolado é uma
          afirmação sobre exatamente duas pessoas — *"estas duas só revisam uma à outra"* —, e
          quem conhece a organização as reidentifica por fora (R2). Com 3, a afirmação deixa de
          se reduzir a um par e passa a ser sobre um conjunto. É o mesmo raciocínio de piso de
          anonimato (k-anonimato com k = 3), e não prova de que 3 basta: um trio também pode
          ser reconhecível. Valor maior esconderia grupos legítimos de equipes pequenas; o
          valor é revisável com dado.
      values:
        min_group_size_shown: 3

  refuses:
    - proposal: "valor de reserva quando o cálculo falha (o 0,01 da referência, `dashboard_team_graph.py:117`)"
      by:
        pt-BR: "repositório de referência"
      reason:
        pt-BR: >
          Medida sem valor é ausente com motivo (FR-009). Um valor de reserva é o fallback
          silencioso que o AGENTS.md §7.7 lista entre os antipadrões: transforma falha em
          número, e número em decisão.
    - proposal: "classificar pessoas em papéis por percentil (\"Coordenador central\", \"Hub\", \"Ponte\", \"Colaborador especializado\")"
      by:
        pt-BR: "repositório de referência, `dashboard_team_graph.py:497-507`"
      reason:
        pt-BR: >
          É julgamento sobre pessoa, e não medida (FR-018). Os cortes de 80, 50 e 30 não têm
          razão escrita, e o percentil de uma pessoa muda quando outra entra na rede.
    - proposal: "janela livre escolhida na tela"
      by:
        pt-BR: "spec 073, versão anterior à avaliação de segurança"
      reason:
        pt-BR: >
          Recusada em R6 (2026-10-03): janela livre é entrada externa que vira consulta e job,
          e a lista fechada é o que impede janela de 100 anos e átomo novo.

  misinterpretations:
    - claim:
        pt-BR: "abaixo da amostra mínima, a revisão não está concentrada"
      why_wrong:
        pt-BR: >
          Abaixo do mínimo a plataforma não diz nada sobre concentração. Ausência de leitura
          não é leitura de ausência.
    - claim:
        pt-BR: "\"N small groups\" é um defeito da tela que esconde dado"
      why_wrong:
        pt-BR: >
          É a proteção declarada de R2: o tamanho 2 aponta para duas pessoas. Quem alcança
          as duas vê o tamanho.
    - claim:
        pt-BR: "as contagens de exclusão dizem quem se auto-revisa ou quem usa bot"
      why_wrong:
        pt-BR: >
          São agregadas por motivo, sem login e sem pessoa. Dizem quanto da revisão
          observada ficou fora da rede, e nada sobre ninguém.
