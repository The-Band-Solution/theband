mapping:
  id: github.pull_request_review.to.qapo.artifact_evaluation.as_review_edge
  version: 1
  status: proposed
source: { provider: github, entity: pull_request_review, api: graphql, schema_version: v4 }
target: { ontology: qapo, concept: qapo.artifact_evaluation }

# ---------------------------------------------------------------------------
# Este mapeamento NÃO cria conceito novo e NÃO substitui
# `github.pull_request_review.to.qapo.artifact_evaluation` (mappings/github/qapo/review.yaml).
# Aquele integra a revisão como avaliação de artefato; este declara como uma avaliação JÁ
# INTEGRADA vira aresta da rede de revisão — revisor → autor da solicitação revisada.
#
# O runtime da 073 lê as avaliações integradas (`qapo_*`) e a autoria das solicitações
# (`cmpo_*`), e não o payload cru. Os `source_path` abaixo nomeiam o campo de ORIGEM de
# cada valor, para que a rastreabilidade até o GitHub fique escrita — e não o caminho de
# leitura do cálculo, que é decisão do plano.
#
# Mapeamentos são escolhidos por id (`Mapper.apply_mapping/2`), e não pela entidade de
# origem: declarar este não faz a ingestão de revisões mudar.
# ---------------------------------------------------------------------------

semantics:
  equivalence: derived
  justification: >
    Uma aresta da rede de revisão é DERIVADA de uma avaliação de artefato
    (`qapo.artifact_evaluation`) cujo artefato avaliado é uma solicitação de mudança
    (`cmpo.change_request`, no papel `qapo.evaluated_artifact`). O revisor é a pessoa que
    participou da avaliação (`qapo.stakeholder_performed_artifact_evaluation`, pelo papel
    `spo.project_person_stakeholder` de uma `eo.person`); o autor é a pessoa que participou
    da submissão que produziu a solicitação (`cmpo.stakeholder_submitted_change_request` e
    `cmpo.submission_produced_change_request`). A aresta liga os dois papéis por meio do
    artefato, e o peso conta solicitações distintas.

    A aresta é sobre REVISÃO. Não é colaboração — colaborar é julgamento sobre a relação
    entre pessoas, e a avaliação é um ato sobre um artefato. Não é delegação — quem abriu
    não designou quem revisou, e a origem nem sempre registra designação de revisor. Não é
    integração — Pull Request não é merge, e quem integrou é `cmpo.stakeholder_performed_checkin`.
    O grau `derived` é o que impede a aresta de ser lida como fato observado: ela é uma
    leitura sobre fatos observados.

derivation:
  rule_id: review.network.parameters
  confidence: high
  inputs:
    - id
    - state
    - submittedAt
    - author.id
    - author.__typename
    - pullRequest.id
    - pullRequest.author.id
  # `precedence` e `on_divergence` ficam de fora: não há declaração disputando com
  # estrutura aqui. A regra não decide → a revisão não vira aresta e entra na contagem
  # de exclusão, que é a forma visível do `skip`.
  fallback: skip

identity:
  external_id_path: id
  # A unidade da aresta é o PAR (solicitação, revisor), e não o evento de revisão: várias
  # rodadas da mesma pessoa sobre a mesma solicitação colapsam numa só contribuição ao peso.
  natural_key: [pullRequest.id, author.id]

attributes:
  # Só o estado decide se a revisão ENTRA, e não a posição dela. As três posições e o
  # descarte entram; o rascunho não. O `value_map` de review.yaml continua sendo a
  # tradução da posição — aqui não se traduz posição, e por isso não há value_map.
  counts_as_review:
    derived_from: "state ∈ {APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED} e submittedAt não nulo → entra; PENDING → não entra; qualquer outro valor → a carga já recusa em review.yaml (unmapped: reject)"
  window_instant:
    source_path: submittedAt
  exclusion_reason:
    derived_from: "review.network.parameters.exclusions — bot_or_app, then unlinked_person, then self_review; nulo quando a revisão vira aresta"

relations:
  reviewer:
    source_path: author.id
    target_ontology: eo
    target_concept: eo.person
    note: >
      Só vira nó a pessoa observada com `account_type = 'person'` em EO. O `__typename`
      (`author_type`) sozinho não basta: uma conta de máquina pode vir como `User` e ser
      `bot` em EO pelo sufixo `[bot]` do login (seguranca.md R9).
  change_request_author:
    source_path: pullRequest.author.id
    target_ontology: eo
    target_concept: eo.person
    note: >
      O autor é o da SUBMISSÃO da solicitação, resolvido na coleta da solicitação
      (`author_person_id`), e não o de commits nem o de quem integrou.
  evaluated_change_request:
    source_path: pullRequest.id
    target_ontology: cmpo
    target_concept: cmpo.change_request

limitations:
  - >
    A aresta é derivada, e nada nela foi dito pela origem como "A revisou B". A origem diz
    que uma conta enviou uma revisão sobre um Pull Request aberto por outra conta; a
    plataforma resolve as duas contas em `eo.person` e liga as duas pessoas. Erro de
    resolução de conta em pessoa vira aresta errada, e é por isso que conta não resolvida é
    excluída e contada, e nunca adivinhada.
  - >
    NÃO é colaboração, NÃO é delegação, NÃO é integração. Nenhuma tela, medida ou texto
    derivado deste mapeamento pode chamar a aresta de "colaboração" (spec 073, FR-005).
  - >
    Revisão DESCARTADA (DISMISSED) entra: a revisão aconteceu, e o descarte é decisão
    posterior sobre ela. Revisão PENDENTE (rascunho, sem submittedAt) não entra: não
    aconteceu ainda.
  - >
    AUTO-REVISÃO (revisor e autor resolvidos na mesma eo.person) não vira aresta, e é
    contada no agregado da leitura — nunca por pessoa (FR-004, R5).
  - >
    BOT OU APLICATIVO em qualquer das pontas (`eo.person` com `account_type` bot ou app, ou
    `__typename` diferente de `User`) não vira aresta, e é contado. Conta de organização
    usada como pessoa (o caso `LEDS` na referência) só é excluída se a coleta a classificar
    como não-pessoa; enquanto `account_type` for `person`, ela é nó — ver a pergunta aberta
    no README desta proposta.
  - >
    SEM PESSOA LIGADA em qualquer das pontas (login que não se resolveu em eo.person, ou
    autor nulo por conta apagada na origem) não vira aresta, e é contado separado de bot.
    Conta apagada vai para "sem pessoa ligada", e não para bot: apagar a conta não é
    evidência de máquina, e classificá-la como bot seria inventar.
  - >
    O login de revisão excluída nunca é listado. A exclusão aparece só como contagem por
    motivo (R9).
  - >
    Revisão de solicitação de outra organização observada, ou de outro tenant, nunca entra.
    A leitura filtra avaliação e solicitação pelo tenant, nos dois lados do join (R12), e
    pela organização observada, buscada por id e tenant juntos (R4).
  - >
    O autor é resolvido quando a solicitação é coletada. Solicitação integrada antes de o
    autor ser ligado a uma pessoa não é percorrida de novo, e a revisão sobre ela fica em
    "sem pessoa ligada" até nova coleta.

provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at]
