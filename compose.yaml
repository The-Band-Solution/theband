services:
  postgres:
    # research.md R1 fixou PostgreSQL 16, e **o volume é 16** — conferido em
    # 2026-08-15 com `cat /var/lib/postgresql/data/PG_VERSION`.
    #
    # Esta linha já disse `17-alpine`, com um comentário afirmando que o ambiente
    # rodava 17. O container só não tinha sido recriado desde então, e a mentira
    # ficou latente: no primeiro `docker compose up` que o recriou, o Postgres
    # recusou subir — *"data directory was initialized by PostgreSQL version 16"*.
    #
    # Subir a imagem exige `pg_upgrade` ou dump e restore. Trocar o número aqui
    # não migra nada: só faz o servidor recusar o volume que já existe.
    image: postgres:16-alpine
    container_name: the_band_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_band_dev
    ports:
      - "5432:5432"
    volumes:
      - the_band_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  the_band_pgdata:
