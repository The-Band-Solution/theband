# Configuração do SonarCloud — feature "QA e SonarCloud".
#
# ## O que este arquivo assume, e o que ele recusa assumir
#
# O SonarCloud **não analisa Elixir**: não há analisador oficial, e plugin de comunidade não
# roda no serviço hospedado. Este repositório tem 31 312 linhas de Elixir contra 1 388 de
# Python — e quase todo o JavaScript é `assets/vendor`.
#
# Deixar o padrão faria o painel analisar menos de 5% do que a plataforma é, e aprovar por
# isso. O Elixir entra pelos relatórios importados que `mix qa.reports` gera.

sonar.organization=the-band-solution
sonar.projectKey=The-Band-Solution_theband
sonar.projectName=theband

sonar.sources=lib,scripts,assets/js,priv/knowledge_base
sonar.tests=test
sonar.sourceEncoding=UTF-8

# `assets/vendor` fica de fora: 9 mil linhas de biblioteca de terceiros afogariam os achados
# do código que este time escreve, e corrigi-las não é decisão deste repositório.
sonar.exclusions=assets/vendor/**,_build/**,deps/**,.venv/**,priv/static/**,cover/**

# ------------------------------------------------------------------ o Elixir, importado
#
# Gerados por `mix qa.reports`. Se o arquivo não existir, o Sonar **avisa e segue** — e é
# por isso que o passo do CI falha explicitamente quando eles faltam: um painel que mostra
# 0% de cobertura sem dizer que não achou o relatório afirma qualidade que ninguém mediu.
sonar.coverageReportPaths=cover/excoveralls.xml
sonar.externalIssuesReportPaths=cover/credo.json

# ------------------------------------------------------------------ o que não se cobra
#
# **Medido no PR #290, e é o que revela o limite desta ferramenta aqui.** O Sonar indexou
# `ncloc_language_distribution = js=24` — vinte e quatro linhas, todas JavaScript. Nenhuma linha
# de Elixir, porque não há analisador.
#
# A importação de cobertura declara 821 linhas cobríveis, e elas apontam para arquivos que o
# Sonar **não conhece**. Sobra o JavaScript, que não tem teste — e o quality gate reprovou por
# `new_coverage = 0%` medindo a única coisa que enxerga, que é a menos importante.
#
# `theme.js` existe por causa da Content-Security-Policy, roda antes da pintura e é conferido
# por olho humano, não por teste unitário. Excluí-lo da cobertura **diz isso**, em vez de fingir
# que a métrica mede algo.
#
# **Quem julga o Elixir são os doze gates**, que rodam offline e reprovam de verdade. O Sonar
# aqui serve para histórico e para o Python.
sonar.coverage.exclusions=assets/js/**,priv/static/**
