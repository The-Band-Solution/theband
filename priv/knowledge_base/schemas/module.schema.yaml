$schema: "https://json-schema.org/draft/2020-12/schema"
$id: the-band/schemas/module
title: Ontology Module
description: >
  Módulo (subontologia) contendo os conceitos e relações de uma parte da ontologia.
  Granularidade equivalente à do módulo Elixir correspondente.
type: object
additionalProperties: false
required: [module]
anyOf:
  - required: [concepts]
    properties: { concepts: { minItems: 1 } }
  - required: [relations]
    properties: { relations: { minItems: 1 } }
$comment: >
  Um módulo precisa declarar conceitos ou relações. Módulos que só declaram
  relações são legítimos: a subontologia de participação em SRO, por exemplo,
  não introduz conceito novo — apenas conecta stakeholders a atividades já
  definidas em SPO e SRO.
properties:
  module:
    type: object
    additionalProperties: false
    required: [id, ontology, name, version, provenance]
    properties:
      id:       { type: string, pattern: "^[a-z_]+\\.[a-z0-9_]+$" }
      ontology: { type: string, pattern: "^[a-z_]+$" }
      name:     { type: string }
      version:  { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$" }
      description:
        type: object
        properties: { pt-BR: { type: string }, en: { type: string } }
      provenance: { $ref: "the-band/schemas/common#/$defs/provenance" }

  concepts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, name, definition, classification]
      properties:
        id:   { type: string, pattern: "^[a-z_]+\\.[a-z0-9_]+$" }
        name: { type: string, description: Nome do conceito como na ontologia de origem (en) }
        label:
          type: object
          properties: { pt-BR: { type: string }, en: { type: string } }
        definition:
          type: object
          required: [pt-BR]
          properties: { pt-BR: { type: string }, en: { type: string } }
        classification:
          type: object
          additionalProperties: false
          required: [ufo_category]
          properties:
            ufo_category:
              description: Categoria fundacional da UFO que classifica o conceito.
              enum:
                [kind, subkind, role, phase, relator, mode, quality, quantity,
                 collective, event, situation, disposition, agent, object,
                 social_object, social_role, social_agent, normative_description,
                 action, complex_action, intention, goal, abstract_individual]
            ontouml_stereotype:
              description: >
                Estereótipo OntoUML, que decide a transformação para o modelo de
                informação (ADR 0004). Ao contrário de ufo_category, que é a
                categoria de topo, este campo expressa sortalidade e rigidez — as
                duas meta-propriedades que determinam se o conceito vira tabela,
                discriminador ou relator.

                  kind        sortal rígido de topo; fornece identidade → vira tabela
                  subkind     sortal rígido; herda identidade → discriminador
                  role        sortal antirrígido relacional → relator
                  phase       sortal antirrígido intrínseco → discriminador
                  relator     kind de entidade dependente que reifica relação → tabela
                  category    não-sortal rígido → achatado
                  role_mixin  não-sortal antirrígido relacional → achatado
                  mixin       não-sortal semi-rígido → achatado
              enum: [kind, subkind, role, phase, relator, category, role_mixin, mixin]
            parent:
              description: Conceito mais geral especializado por este (pode ser de outra ontologia).
              type: string
            is_role_of:
              description: Conceito que assume este papel, quando classification for role.
              type: string
        identity_criterion:
          description: >
            Princípio de identidade do conceito: o que permite dizer se dois
            registros são o mesmo indivíduo. Declarar isto é o teste operacional
            de kind — um conceito cujos descendentes precisam de critérios
            diferentes não é kind, é category, e será achatado (ADR 0004).

            Os componentes devem ser IDENTIFICADORES e imutáveis. Incluir
            atributo descritivo que muda ao longo da vida do indivíduo faria o
            hash mudar junto, quebrando toda referência existente.
          type: object
          additionalProperties: false
          required: [form, components]
          properties:
            form:
              description: >
                external — identidade vem da fonte (source_system, source_instance, external_id);
                natural  — combinação de atributos próprios;
                composite_hash — hash determinístico dos componentes, usado como internal_id.
              enum: [external, natural, composite_hash]
            components:
              type: array
              minItems: 1
              items: { type: string }
            nullable_components:
              description: >
                Componentes que podem estar ausentes, com representação canônica
                definida para que o hash permaneça determinístico.
              type: array
              items: { type: string }
            inherited_by_subtypes:
              description: >
                true quando todos os descendentes usam este mesmo critério — o que
                sustenta a classificação como kind. false indica que os subtipos
                refinam a identidade, e então este conceito é candidato a category.
              type: boolean
            note: { type: string }
        attributes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, type]
            properties:
              name:     { type: string }
              type:     { enum: [string, text, integer, decimal, boolean, date, datetime, duration, enum] }
              required: { type: boolean, default: false }
              values:   { type: array, items: { type: string } }
              description: { type: string }
        constraints:
          type: array
          description: Ids de regras em rules/ que restringem este conceito.
          items: { type: string }
        examples:
          type: array
          items: { type: string }
        automated:
          type: boolean
          description: Marca conceitos que, em Continuum, ocorrem sem intervenção humana.
        provenance: { $ref: "the-band/schemas/common#/$defs/provenance" }

  relations:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, name, source, target]
      properties:
        id:     { type: string, pattern: "^[a-z_]+\\.[a-z0-9_]+$" }
        name:   { type: string, description: "Verbo da relação. Em Continuum, no passado." }
        label:
          type: object
          properties: { pt-BR: { type: string }, en: { type: string } }
        source: { type: string }
        target: { type: string }
        type:
          enum: [association, part_whole, dependency, participation, materialization,
                 causation, specialization, derivation]
        cardinality:
          type: object
          additionalProperties: false
          properties:
            source: { enum: [one, zero_or_one, many, one_or_many] }
            target: { enum: [one, zero_or_one, many, one_or_many] }
        temporal:
          type: object
          additionalProperties: false
          properties:
            type: { enum: [enduring_relation, event_relation, historical_relation] }
        semantics:
          type: object
          properties: { description: { type: string } }
        # Opcional, como em concepts. Existe para o caso em que o módulo vem de uma
        # ontologia publicada e uma relação dele **não** vem: sem isto, a relação que
        # o projeto acrescentou fica indistinguível das que SEON declara, e a
        # proveniência do módulo — reference_ontology — passaria a cobrir algo que
        # não é da referência.
        provenance: { $ref: "the-band/schemas/common#/$defs/provenance" }
