$schema: "https://json-schema.org/draft/2020-12/schema"
$id: the-band/schemas/measurement
title: Measurement
description: >
  Medida derivada dos conceitos ontológicos. Limitações e interpretações
  incorretas possíveis são obrigatórias — um número sem contexto engana.
type: object
additionalProperties: false
required: [measurement]
properties:
  measurement:
    type: object
    additionalProperties: false
    required: [id, name, answers_information_need, value_type, formula, scope, limitations, provenance]
    properties:
      id:   { type: string }
      name: { $ref: "the-band/schemas/common#/$defs/label" }
      answers_information_need: { type: array, minItems: 1, items: { type: string } }
      value_type: { enum: [count, ratio, percentage, duration, currency, score] }
      unit: { type: string }
      formula:
        type: object
        additionalProperties: false
        required: [expression, inputs]
        properties:
          expression: { type: string }
          inputs: { type: array, minItems: 1, items: { type: string } }
      scope:
        type: object
        additionalProperties: false
        required: [levels]
        properties:
          levels: { type: array, minItems: 1, items: { type: string } }
          filters: { type: array, items: { type: string } }
          period: { type: string }
      limitations: { type: array, minItems: 1, items: { type: string } }
      misinterpretations: { type: array, items: { type: string } }
      provenance: { $ref: "the-band/schemas/common#/$defs/provenance" }
