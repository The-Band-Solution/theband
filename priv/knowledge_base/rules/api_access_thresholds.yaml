derivation_rule:
  id: api.access.thresholds
  version: 1
  provider: platform
  status: proposed
  confidence: high

  name:
    pt-BR: "Os limiares e o vocabulário do token de API — prazo, aviso, prefixo e os estados"

  description:
    pt-BR: >
      A API pública (spec 061) é aberta por um token que alguém gera na área administrativa.
      Este arquivo declara os números e as palavras desse token: quanto ele vale, quando a
      tela avisa que vai vencer, que prefixo ele carrega, e como cada estado é lido.

      Moram aqui, e não em constante de módulo, pela razão de FR-069 e pelo precedente de
      `team.dashboard.thresholds`: um prazo de credencial é **decisão sobre quanto tempo um
      segredo continua abrindo a porta**. Em constante, ele muda num diff e ninguém percebe.

      **Padrão silencioso de expiração derruba integração meses depois sem ninguém ligar as
      duas coisas** — e *nenhuma* expiração é superfície que ninguém vigia. A saída é o padrão
      declarado, dito na tela, com aviso antes do vencimento. É a decisão Q8 da spec.

  provenance:
    source_type: project_decision
    reference: "spec 061, perguntas Q1 e Q8; avaliação de Security de 2026-09-09"
    note: >
      Q8 fixou os dois primeiros valores. O terceiro — o aviso de vencimento — veio do
      protótipo da tela em 2026-09-18, que mostra *"expires in 9 days"* e obrigou a pergunta:
      a tela não pode avisar contra um limiar que não existe.

      O prefixo entra aqui porque **duas coisas precisam da mesma string**: a tela, que a
      imprime, e o padrão do varredor de segredo, que a procura em repositório e em log. Duas
      cópias divergem, e a que fica para trás é a do varredor — que falha em silêncio.

  rules:
    token_lifetime:
      name:
        pt-BR: "Noventa dias é o prazo sugerido, e 'sem expiração' é oferecido"
      statement:
        pt-BR: >
          A tela oferece prazos de 7, 30 e 90 dias **e também "sem expiração"**. 90 dias
          continua sendo o padrão sugerido; deixar de escolher prazo é escolha explícita de
          quem cria, e não o caminho mais fácil.
      note:
        pt-BR: >
          **Esta regra foi revertida em 2026-09-23, por decisão da pessoa mantenedora.**

          Até então a tela **não** oferecia "sem expiração", e a razão escrita era: *"máximo
          do qual se abre mão não é máximo"* — uma credencial sem fim é superfície que
          ninguém vigia, e o prazo era a única coisa que a fazia reaparecer diante de alguém.

          **A consequência da reversão, dita aqui para não ser descoberta depois**: um token
          sem expiração só sai de circulação por revogação deliberada. Não há job que o
          encerre, e a plataforma não avisa ninguém de que ele existe — a tela de tokens é a
          única superfície, e ninguém a abre numa terça-feira sem motivo.

          Duas coisas continuam valendo e limitam o estrago: o alcance do token é o da conta
          dona, **relido a cada chamada**, e uma conta desativada faz toda chamada ser
          recusada. Um token sem prazo de uma pessoa que saiu já não abre nada.

          FR-011 sempre admitiu a ausência de expiração como estado legítimo. O que mudou é
          que ela passa de **exibida** a **oferecida**.
      applied: true
      values:
        max_days: 90
        sem_expiracao_oferecida: true

    token_revocation_reason:
      name:
        pt-BR: "Revogar um token grava por quê"
      statement:
        pt-BR: >
          A revogação registra, além de quem e quando, uma **cláusula** — `integracao_encerrada`,
          `suspeita_de_vazamento`, `substituido_por_outro`, `outro` — e uma nota livre
          opcional.
      note:
        pt-BR: >
          Decidido em 2026-09-23. Até então a revogação gravava só quem e quando, e isso era
          **omissão, não decisão** — a spec não tinha sido perguntada.

          A cláusula que justifica o campo é `suspeita_de_vazamento`: é o único caso em que o
          próximo ato muda — girar tudo o que aquela conta alcança, e não só substituir a
          integração. Uma revogação sem razão é decisão que ninguém reconstrói em seis meses.

          A lista é **fechada e casada uma a uma**, com nota livre ao lado: lista aberta vira
          texto que ninguém consegue contar, e contagem é o que responde *"quantas revogações
          foram por suspeita de vazamento neste trimestre?"*.
      applied: true
      values:
        clausulas:
          - integracao_encerrada
          - suspeita_de_vazamento
          - substituido_por_outro
          - outro
        # As palavras da tela moram aqui, e não no LiveView: a cláusula gravada, a opção do
        # select e a linha do relatório têm de ser a mesma coisa. Vocabulário escrito em dois
        # lugares diverge no dia em que alguém muda um deles.
        rotulos:
          integracao_encerrada: { pt-BR: "integração encerrada", en: "integration ended" }
          suspeita_de_vazamento: { pt-BR: "suspeita de vazamento", en: "suspected leak" }
          substituido_por_outro:
            { pt-BR: "substituído por outro token", en: "replaced by another token" }
          outro: { pt-BR: "outro", en: "other" }

    rate_limit:
      name:
        pt-BR: "Quantas chamadas um token faz por minuto, e o que acontece ao passar"
      statement:
        pt-BR: >
          Um token faz no máximo **120 chamadas por minuto**. Acima disso a requisição é
          recusada com `429`, e a recusa **diz qual é o limite e quando a janela reabre** —
          nunca em silêncio.

          A janela **desliza**: o minuto é contado em fatias de dez segundos, e a conta é a
          soma das que cobrem os últimos sessenta. Não há instante em que a contagem zera.

          A contagem é por **token**, e não por tenant nem por endereço de rede: o token é a
          identidade que a API conhece, e é a que se revoga.
      note:
        pt-BR: >
          **Este número é proposta, e está aqui para ser mudado por quem decide** — não para
          ser descoberto num `grep`. Mora na base de conhecimento, e não em constante de
          módulo, pela mesma razão do prazo do token: limiar em constante muda num diff e
          ninguém percebe.

          A avaliação de segurança da feature 062, em 2026-09-22, achou que **não havia
          limite algum** — e a spec do MCP dizia herdar "o limite da 061", que não existia.
          Herdar um controle inexistente é herdar zero, e por MCP é pior: o consumidor é um
          programa que itera sem cansar.

          120 por minuto é folgado de propósito: uma integração que percorre páginas não
          deve esbarrar nele, e um laço que não converge deve. Se a medida mostrar que o
          número está errado, ele muda **aqui**.
      applied: true
      values:
        requests_per_minute: 120
        window_seconds: 60

    access_log_retention:
      name:
        pt-BR: "O registro de leitura da API é guardado indefinidamente"
      statement:
        pt-BR: >
          As linhas de `api_access_reads` — quem leu, de qual credencial, qual rota, qual
          alvo e quando — **não têm prazo de expurgo**. Nenhum job as apaga.
      note:
        pt-BR: >
          **Isto é decisão, e não ausência de decisão** — a diferença importa, e até
          2026-09-23 era a segunda. A tabela nasceu no PR #936 sem poda porque ninguém tinha
          decidido o prazo; agora o prazo foi decidido, e é *indefinido*.

          Decidido pela pessoa mantenedora em 2026-09-23, depois de a alternativa de 90 dias
          ser proposta e recusada.

          **O custo de espaço não é o argumento, e foi medido**: 190 bytes por linha — 100
          mil linhas ocupam 18 MB, menos que as tabelas de coleta que já existem
          (`spo_performed_project_activities` tem 68 MB). Chegar a 1 GB exige 5,5 milhões de
          leituras.

          **O que o prazo indefinido significa**, e fica escrito para que ninguém precise
          deduzir: o registro permite reconstruir, sem limite de tempo, que uma pessoa
          consultou o painel de outra — quantas vezes e quando. A FR-024 pede o registro
          para **detectar agregação**; guardá-lo para sempre entrega mais do que aquela
          necessidade pede, e essa diferença é a escolha que foi feita.

          **Se a decisão mudar**, o conserto é um job de expurgo e um prazo aqui — não há
          nada no desenho que dependa da retenção infinita.
      applied: true
      values:
        retention_days: null

    token_expiry_warning:
      name:
        pt-BR: "A tela avisa quatorze dias antes de vencer"
      statement:
        pt-BR: >
          A partir de **14 dias** antes da expiração, a linha do token diz quantos dias faltam,
          em vez de só a data.
      note:
        pt-BR: >
          É leitura contra o relógio, feita no render — **não é job**. Job cria janela entre o
          vencimento e a passagem dele, e essa janela é acesso concedido por atraso de fila; o
          mesmo argumento da decisão Q3 sobre não cachear o token.

          Quatorze dias é o que cabe numa quinzena de trabalho: quem vê o aviso tem tempo de
          gerar o novo, trocar na integração, e revogar o velho **nessa ordem**.

          **O alcance do aviso é esta tela, e nada mais** — decidido em 2026-09-23. A resposta
          inicial da Q6 do protótipo era e-mail para quem criou; foi adiada ao aprovar as três
          mudanças de tela. Medido no mesmo dia: a plataforma não envia e-mail nenhum — nenhuma
          dependência no `mix.exs`, nenhum módulo `Mailer`, nenhuma variável de SMTP.

          A consequência fica escrita para ser lacuna conhecida: **quem não abre a tela não
          recebe o aviso**. Um token vence sem que ninguém seja alcançado, e a integração
          descobre pela recusa. O item está em `docs/backlog/aviso-de-vencimento-do-token.md`.
      applied: true
      values:
        warning_days: 14
        reach: tela

    token_idle_expiry:
      name:
        pt-BR: "Trinta dias sem uso — declarado, e ainda NÃO aplicado"
      statement:
        pt-BR: >
          Um token sem chamada aceita há mais de **30 dias** é candidato a expirar por desuso.
      note:
        pt-BR: >
          **Declarado e não aplicado nesta fatia**, e a distinção é o ponto: aplicar exige o
          carimbo de último uso maduro, e ele nasce com a primeira chamada. Expirar por desuso
          um token que nunca teve chance de ser usado derrubaria a integração no dia seguinte
          ao de gerá-la.

          Limiar declarado e não aplicado é pior que limiar ausente **se ninguém disser qual é
          qual** — por isso `applied` é campo desta regra, e não comentário.
      applied: false
      values:
        idle_days: 30

  vocabulary:
    token_prefix:
      name:
        pt-BR: "O prefixo que identifica o token como desta plataforma"
      statement:
        pt-BR: >
          Todo token começa por `tb_api_`, e a forma inteira é
          `tb_api_<id_publico>_<segredo>` — três partes separadas por `_`.
      note:
        pt-BR: >
          O prefixo existe para que **varredura de segredo** em repositório, log e histórico de
          terminal reconheça o vazamento sem saber o valor. Prefixo certo com resto inválido
          recebe a **mesma recusa** de token inexistente: ele serve para varrer, nunca para
          triar validade.

          As **três partes** não são estética. A busca no banco é pelo id público, indexado e
          único, e **nunca pelo hash** — comparar hash é comparação do Postgres, fora do nosso
          controle de tempo, e a decisão Q1 exige tempo constante. O formato é consequência.
      values:
        prefix: "tb_api_"
        parts: 3
        separator: "_"

    token_state:
      name:
        pt-BR: "Os três estados do token, e como cada um é lido"
      statement:
        pt-BR: >
          O estado **não é coluna**. É leitura contra o instante da requisição, das duas
          colunas de marca.
      note:
        pt-BR: >
          Coluna de estado exigiria job para virar `expired`, e job cria a janela entre vencer
          e ser marcado — acesso concedido por atraso de fila.

          **A quarta frase que a tela mostra não é estado de token**: *"chamadas recusadas ·
          conta dona desativada"* fala da conta, não do token. Misturá-la com as três faria
          revogar o token parecer o conserto, quando o conserto é reativar a conta.
      values:
        active:
          read_as: "revoked_at nulo E (expires_at nulo OU expires_at no futuro)"
          declared: false
        revoked:
          read_as: "revoked_at presente"
          declared: true
        expired:
          read_as: "expires_at no passado"
          declared: false

    absence_words:
      name:
        pt-BR: "As palavras das duas ausências — e nenhuma delas é uma data"
      statement:
        pt-BR: >
          Último uso nulo é **"nunca usado"**. Expiração nula é **"sem expiração"**.
      note:
        pt-BR: >
          Declaradas aqui para que **tela e API não divirjam**. A API responde em JSON, onde
          `null` é um valor só — e "nunca usado" e "sem expiração" são coisas diferentes que
          um `null` cru achataria.

          Último uso nulo **nunca** vira a data de criação: um token recém-gerado e um token
          que ninguém usou há meses são a mesma coisa para esta coluna, e inventar a data de
          criação faria o primeiro parecer usado.
      values:
        never_used: { pt-BR: "nunca usado", en: "never used" }
        no_expiration: { pt-BR: "sem expiração", en: "no expiration" }

  reuses:
    - id: access.account_lifecycle
      why:
        pt-BR: >
          O estado da **conta dona** vem de lá, e não daqui. Um token de conta desativada é
          recusado, e a razão está no vocabulário daquela regra.
