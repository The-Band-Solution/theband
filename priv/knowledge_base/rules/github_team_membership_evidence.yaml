derivation_rule:
  id: github.team_membership_evidence
  version: 3
  provider: github
  status: proposed
  confidence: high

  name:
    pt-BR: "Vínculo de pessoa a time observado no GitHub"
  description:
    pt-BR: >
      Define como tratar o fato de uma pessoa integrar um time do GitHub, dado
      que o GitHub não expõe papel organizacional.

      eo.team_membership é o relator que aloca uma pessoa para desempenhar um
      papel organizacional em uma equipe. Os três elementos são necessários:
      pessoa, equipe e papel. O GitHub fornece dois — pessoa e equipe — e não
      fornece o terceiro.

      MAINTAINER e MEMBER, os únicos valores que a API devolve, são níveis de
      administração do time na plataforma. Dizem quem pode gerir membros e
      permissões. Não dizem se a pessoa é programadora, testadora, designer ou
      gerente. Promovê-los a eo.organizational_role produziria um catálogo de
      papéis que não corresponde a nenhuma função real, e faria CQ12, CQ14 e
      CQ16 retornarem respostas falsas em vez de nenhuma.

  inputs:
    - organization.teams.slug
    - team.members.login

  availability:
    required_api_fields: [organization.teams, team.members]
    required_scopes: [read:org]

  # ---------------------------------------------------------------------------
  # O que é materializado a partir do GitHub
  # ---------------------------------------------------------------------------
  materializes:
    - concept: eo.person
      from: team.members.node
      confidence: high
    - concept: eo.organizational_team
      from: organization.teams.nodes
      confidence: high
    # Versão 2 (2026-09-06, decisão da pessoa mantenedora). O relator exige pessoa, equipe e
    # papel; a plataforma passa a materializá-lo com o papel DECLARADAMENTE AUSENTE, porque a
    # participação é fato observado e a medida por equipe é impossível sem ela. Medido antes
    # da mudança: 59 evidências nas 8 equipes do GitHub, zero vínculos, toda medida por
    # equipe vazia, 78% das solicitações fora de qualquer medida.
    - concept: eo.team_membership
      from: team.members
      confidence: medium
      note: >
        Vínculo OBSERVADO: organizational_role_id nulo ("papel não declarado"),
        declared_by_user_id nulo, started_at nulo (a origem não diz desde quando). Quem
        administra declara o papel depois, no mesmo vínculo. Quando a origem deixa de mostrar
        a pessoa no time, o vínculo observado é encerrado (ended_at = instante da ausência);
        vínculo declarado não é tocado pela coleta, e as duas afirmações aparecem lado a lado.

        VERSÃO 3 (2026-09-07). Depois de uma SAÍDA DECLARADA (ended_by_user_id preenchido) ou
        de um EQUÍVOCO (invalidated_at) sobre o vínculo observado, a coleta NÃO recria o
        vínculo enquanto a observação da origem for CONTÍNUA — isto é, enquanto a evidência
        não tiver no_longer_observed_at. A origem continua listando a pessoa, a evidência
        continua viva, e a tela mostra as duas afirmações até alguém corrigir a origem.

        Uma observação NOVA depois de ausência constatada é RETORNO, e nasce vínculo
        observado novo; os períodos coexistem, e o antigo permanece com o seu fim. É a mesma
        regra do "quem saiu e voltou ganha vínculo novo" (ADR 0008, item 5), estendida à saída
        declarada — antes da versão 3, a saída declarada num vínculo observado era desfeita
        pela coleta seguinte, porque a guarda só reconhecia autor, papel e equívoco.

  # ---------------------------------------------------------------------------
  # O que NÃO é materializado, e por quê
  # ---------------------------------------------------------------------------
  does_not_materialize:
    - concept: eo.organizational_role
      reason:
        pt-BR: >
          Não existe no GitHub. O papel organizacional vem de cadastro do tenant
          ou de outra fonte que o registre, como um sistema de RH ou uma
          ferramenta de gestão de projetos.
    # eo.team_membership saiu desta lista na versão 2 — ver `materializes`. O que
    # continua não materializado é o PAPEL: CQ14 e CQ16 (perguntas sobre papel) seguem
    # sem resposta até a declaração, e o vínculo observado diz isso de si mesmo.

  # ---------------------------------------------------------------------------
  # O vínculo observado é preservado como evidência E materializado como vínculo
  # ---------------------------------------------------------------------------
  observed_link:
    name:
      pt-BR: "Vínculo observado de pessoa a time"
    persisted_as: team_membership_evidence
    attributes:
      - { name: person_external_id, from: team.members.node.id }
      - { name: team_external_id, from: organization.teams.nodes.id }
      - { name: platform_access_level, from: team.members.role, note: "MAINTAINER ou MEMBER — nível de acesso, não papel" }
      - { name: observed_at, from: collected_at }
    promotion:
      to: eo.team_membership
      requires: nothing
      note: >
        Versão 2: a promoção é AUTOMÁTICA na coleta, para vínculo observado sem papel.
        A evidência continua existindo e aponta para o vínculo (promoted_membership_id).
        Declarar o papel é ato de quem administra, sobre o mesmo vínculo — e é o que
        transforma observado em declarado (declared_by_user_id preenchido).

        Versão 3: a promoção automática NÃO acontece quando já existe, para o mesmo par
        pessoa–equipe, uma declaração da organização que a contradiga — saída com autor ou
        equívoco — e a observação é contínua. A declaração da organização vence a
        observação enquanto as duas discordarem; a coleta registra que a origem ainda lista,
        e não afirma pertencimento por cima de quem disse o contrário.

  gap_reporting:
    metric: memberships_pending_role
    note: >
      O número de vínculos VIGENTES SEM PAPEL é informação, não erro. Mede quanto da
      estrutura organizacional o sistema ainda não conhece, e aparece na tela da equipe
      junto de cada medida: "N membros — X observados sem papel declarado, Y declarados".

  # ---------------------------------------------------------------------------
  # Limitação temporal
  # ---------------------------------------------------------------------------
  temporal_limitation:
    pt-BR: >
      A API não informa quando uma pessoa entrou no time. started_at e ended_at
      de eo.team_membership ficam nulos quando o vínculo é promovido a partir do
      GitHub. Só é possível saber que o vínculo existia no momento da coleta.
      Análises que dependam de histórico de alocação — quem estava no time em
      determinado sprint — não são respondíveis a partir desta fonte.

  fallback: skip

  provenance:
    source_type: tool_documentation
    reference: "GitHub GraphQL API — Organization.teams, Team.members"
    note: >
      Verificado contra a organização The-Band-Solution em 2026-08-08: 6 membros,
      2 times, papéis de plataforma observados MAINTAINER e MEMBER. Nenhum campo
      da API expressa função na organização.
