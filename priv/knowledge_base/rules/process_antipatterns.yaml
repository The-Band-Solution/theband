derivation_rule:
  id: process.antipatterns
  version: 1
  provider: platform
  status: proposed
  confidence: medium

  name:
    pt-BR: "Antipadrões do processo executado"

  description:
    pt-BR: >
      As máximas que descrevem a distância entre o processo **declarado** e o **executado**.

      A plataforma observa a timeline de cada issue — quem designou, quem moveu, quem fechou —
      e compara com o que o processo pressupõe. Quando a sequência observada contradiz a
      pressuposta, isso é registrado como antipadrão.

      **A regra de início é a movimentação.** Um trabalho começa quando alguém o move no
      quadro; antes disso ele está designado, e designado não é começado. É a decisão da
      pessoa mantenedora em 2026-08-14, e ela é declaração — a plataforma recusa escolher
      sozinha qual evento marca o início (feature 022, FR-007).

  rationale:
    pt-BR: >
      Sem esta declaração, a plataforma tem `created` e `closed` e nada entre os dois: não há
      cycle time, não há WIP verdadeiro, e as 1642 issues abertas com designado incluem quem
      foi designado meses atrás e nunca começou.

      Com ela, a plataforma passa a saber duas coisas — e a segunda é a que importa mais.
      Sabe medir o que foi movido; e sabe **dizer o que não consegue medir, e por quê**.

  what_this_is_not:
    pt-BR: >
      **Não é avaliação de pessoa.** Um antipadrão diz que o registro do processo está
      incompleto, não que alguém trabalhou mal. Quem fez a tarefa e não moveu o cartão fez a
      tarefa; o que falta é o rastro, e o custo disso é a organização perder a medida.

      **Não é reprovação.** Estas regras têm `enforcement: detection`: a plataforma relata e
      nunca recusa. Um axioma da tese diz o que o modelo não pode violar; um antipadrão diz o
      que o mundo observado fez.

      **E não é afirmação sobre intenção.** A plataforma não sabe por que o cartão não foi
      movido — pode ter sido esquecimento, pode ser que o time não use o quadro. O que ela
      afirma é o que observou.

  antipatterns:
    - id: process.ap01.closed_without_movement
      name:
        pt-BR: "Concluída sem ter sido movida"
      statement:
        pt-BR: >
          A issue foi designada a alguém e fechada, e **nenhuma movimentação** aconteceu entre
          as duas coisas. O trabalho foi feito; o quadro não soube.
      formal: >
        ∀ i: Issue, p: Person
          (assigned(i, p) ∧ closed(i) ∧ ¬∃m (moved(i, m) ∧ occurred_between(m, assigned(i,p), closed(i))))
          → ClosedWithoutMovement(i)
      consequence:
        pt-BR: >
          **O cycle time desta issue não pode ser calculado**, e é a consequência que importa —
          não a violação em si. A plataforma não sabe quando o trabalho começou, e qualquer
          número que ela mostrasse seria inventado.
      concepts: [spo.performed_project_activity, sro.intended_scrum_development_task]
      enforcement: detection
      severity: informativo

    - id: process.ap02.moved_after_closing
      name:
        pt-BR: "Movida depois de concluída"
      statement:
        pt-BR: >
          A movimentação para "em andamento" aconteceu **depois** do fechamento. O registro foi
          feito ao final, para acertar o quadro.
      formal: >
        ∀ i: Issue, m: Movement
          (moved_to_in_progress(i, m) ∧ closed(i) ∧ occurred_after(m, closed(i)))
          → MovedAfterClosing(i)
      consequence:
        pt-BR: >
          O instante registrado como início é posterior ao fim, e o cycle time sairia negativo.
          A plataforma **não corrige e não descarta**: registra o antipadrão e recusa a medida.
      concepts: [spo.performed_project_activity]
      enforcement: detection
      severity: informativo

    - id: process.ap03.assigned_and_never_started
      name:
        pt-BR: "Designada há muito tempo e nunca iniciada"
      statement:
        pt-BR: >
          A issue está designada, aberta, e nunca foi movida. Ela conta como trabalho de alguém
          sem nunca ter começado.
      formal: >
        ∀ i: Issue, p: Person
          (assigned(i, p) ∧ open(i) ∧ ¬∃m moved(i, m)) → AssignedAndNeverStarted(i)
      consequence:
        pt-BR: >
          É a diferença entre **designado** e **em progresso**, e ela é o que torna o WIP
          verdadeiro possível. Contar as designadas como WIP infla a medida com trabalho que
          ninguém começou.
      concepts: [spo.performed_project_activity]
      enforcement: detection
      severity: informativo

    - id: process.ap04.movement_without_assignee
      name:
        pt-BR: "Movida sem ninguém designado"
      statement:
        pt-BR: >
          A issue foi movida para "em andamento" e não há pessoa designada a ela.
      formal: >
        ∀ i: Issue
          (moved_to_in_progress(i) ∧ ¬∃p assigned(i, p)) → MovementWithoutAssignee(i)
      consequence:
        pt-BR: >
          A atividade tem instante e **não tem executor**. O conceito prevê `performer_id`
          anulável para automação, e aqui a ausência é outra coisa: alguém moveu, e a
          plataforma não sabe quem trabalha nisso.
      concepts: [spo.performed_project_activity, spo.is_in_charge_of]
      enforcement: detection
      severity: informativo

  structural_antipatterns_rationale:
    pt-BR: >
      Os quatro acima são sobre **uma issue**: ela foi designada, fechada, movida. Os dois
      abaixo são sobre o **quadro**, e a diferença importa: um antipadrão de instância afeta
      uma issue, e um de estrutura impede a medida de **todas** as issues daquele quadro.

      Eles não se detectam olhando issue por issue. Detectam-se olhando o conjunto de estados
      que o quadro usa.

  structural_antipatterns:
    - id: process.ap05.board_without_in_progress
      name:
        pt-BR: "Quadro sem estado de trabalho em andamento"
      statement:
        pt-BR: >
          Nenhum dos estados do quadro significa "alguém está trabalhando nisto". O trabalho
          acontece **entre** dois estados, e o quadro não o representa.
      measured:
        pt-BR: >
          Medido em 2026-08-14, em 200 issues do quadro da `The-Band-Solution`:

              Done 182 · Backlog 92 · In review 55 · Ready 28

          O fluxo é `Backlog → Ready → In review → Done`. `Ready` é antes de pegar; `In review`
          é depois de fazer. **O fazer não tem estado.**

          E não é limitação da ferramenta: o quadro da `leds-conectafapes`, medido no mesmo
          dia, tem `In Progress`, `In Validation` e `Homologation`. Um quadro consegue
          expressar; o outro não.
      formal: >
        ∀ b: Board
          (¬∃s (state_of(b, s) ∧ means_in_progress(s))) → BoardWithoutInProgress(b)
      recognized_in_progress_states:
        note:
          pt-BR: >
            O predicado `means_in_progress` precisa de algum modo de ser avaliado, e este é
            ele: os nomes abaixo, comparados ignorando caixa, acento e separador.

            **Isto não é a declaração da FR-007, e a diferença importa.** A FR-007 recusa
            escolher **qual** movimentação marca o começo — `Ready` significa pronto para
            pegar ou já pego? Só quem conhece o quadro sabe. Aqui a pergunta é mais fraca e
            a plataforma consegue respondê-la: existe **algum** estado que plausivelmente
            signifique trabalho acontecendo?

            Reconhecer aqui não declara nada; **não** reconhecer é que afirma o `ap05`.

            A lista é curta de propósito. Ela erra para o lado de sinalizar: um nome de
            andamento fora dela produz um aviso falso, que alguém corrige acrescentando o
            nome. O erro contrário — reconhecer o que não é andamento — silenciaria o
            antipadrão, e ninguém procura o que não foi avisado.
        values:
          - "in progress"
          - "in-progress"
          - "doing"
          - "wip"
          - "work in progress"
          - "started"
          - "em andamento"
          - "em progresso"
          - "em desenvolvimento"
          - "desenvolvendo"
          - "executando"
          - "fazendo"
      consequence:
        pt-BR: >
          **O cycle time é impossível para toda issue deste quadro**, e não para algumas. Não
          há instante que marque o começo, porque não há estado que o represente.

          E o WIP não existe: contar o que está em `Ready` conta quem ainda não pegou; contar
          `In review` conta quem já terminou. Nenhum dos dois é trabalho em andamento.
      concepts: [spo.performed_project_activity]
      enforcement: detection
      severity: estrutural
      remediation:
        pt-BR: >
          **A correção é no quadro, e não no código**: alguém acrescenta um estado que signifique
          "em andamento". A plataforma não cria estado, e não deveria — o quadro é da organização.

          **E ela vale só para frente.** O estado vira evento no instante em que alguém move um
          cartão; issue que já passou pelo fluxo antigo não ganha movimentação retroativa. Depois
          da correção, o antipadrão continua verdadeiro para o histórico e falso para o que vier —
          e a tela **precisa dizer a partir de quando**, ou alguém vai concluir que a correção não
          funcionou ao ver as issues antigas ainda sinalizadas.

    - id: process.ap06.states_that_duplicate_meaning
      name:
        pt-BR: "Dois estados para o mesmo significado"
      statement:
        pt-BR: >
          O quadro tem estados distintos que significam a mesma coisa. As issues se dividem
          entre eles, e qualquer contagem por estado sai partida.
      measured:
        pt-BR: >
          Medido em 2026-08-14, no quadro da `leds-conectafapes`: **`To Do` e `Todo`
          coexistem**, com issues nos dois.
      formal: >
        ∀ b: Board, s1: State, s2: State
          (state_of(b, s1) ∧ state_of(b, s2) ∧ s1 ≠ s2 ∧ same_meaning(s1, s2))
          → StatesThatDuplicateMeaning(b)
      consequence:
        pt-BR: >
          Toda medida por estado fica errada, e **errada para menos**: quem contar `To Do`
          encontra metade do que existe, e o número parece plausível.

          É a mesma família do desvio que a plataforma já reporta nas issues — dois caminhos
          para o mesmo fato, discordando em silêncio.
      concepts: [spo.performed_project_activity]
      enforcement: detection
      severity: estrutural
      note:
        pt-BR: >
          **A plataforma não decide que dois nomes têm o mesmo significado.** Ela mostra os
          estados observados com a frequência, e alguém confirma — pela mesma razão de a
          alocação de papel ser declaração humana. `Refinamento` e `Pronto para
          desenvolvimento` podem ser etapas distintas de verdade.

  limits:
    pt-BR: >
      **Toda regra aqui depende da movimentação ser observada**, e ela vive no quadro do
      Projects v2 — issue #181. Sem essa coleta, a plataforma detecta zero antipadrões, e isso
      não significa que o processo está saudável: significa que ela não olhou.

      Essa distinção **precisa aparecer na tela**. "Nenhum antipadrão encontrado" e "não há
      dado de movimentação" são frases diferentes, e confundi-las é o defeito que a L57
      descreve — verificação que percorre lista vazia e devolve verde.

  provenance:
    source_type: maintainer_decision
    reference: "Decisão da pessoa mantenedora em 2026-08-14, na conversa que originou a feature 022"
    note:
      pt-BR: >
        Estas máximas **não vêm da tese**, e por isso não estão em `sro_axioms.yaml`. Os
        axiomas da SRO são verdades que o modelo preserva; estas são padrões que a organização
        reconhece no processo dela, e outra organização pode reconhecer outros.
