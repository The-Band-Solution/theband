# O commit vira cmpo.commit_artifact_copy — a ATIVIDADE, não o objeto.
#
# É a decisão que carrega este mapeamento, e ela vem da ontologia: a CMPO define
# `cmpo.commit_artifact_copy` como **atividade** que envia uma cópia de artefato sem
# conflito para a branch de destino (ufo action). O que o Git chama de "commit" é
# ambíguo entre o ato e o objeto resultante — e a rede desfaz a ambiguidade:
#
#   | o que é                       | conceito                  | UFO      |
#   |-------------------------------|---------------------------|----------|
#   | o ato de commitar             | cmpo.commit_artifact_copy | action   |
#   | a cópia versionada do arquivo | cmpo.artifact_copy        | object   |
#   | o conjunto num check-in       | cmpo.checkin              | complex_action |
#
# Este mapeamento cobre o ATO. A cópia de artefato exigiria o diff por arquivo (o
# `files` da API), e nada a consome hoje — limitação declarada.
mapping:
  id: github.commit.to.cmpo.commit_artifact_copy
  version: 1
  status: proposed
source:
  provider: github
  entity: commit
  api: graphql
  schema_version: v4
target:
  ontology: cmpo
  concept: cmpo.commit_artifact_copy
semantics:
  equivalence: total
  justification: >
    Um commit do Git é o ato que envia cópias de artefato para uma branch de destino,
    com autor, instante e mensagem — a definição de cmpo.commit_artifact_copy, que é
    atividade (ufo action) e não objeto. A equivalência é total para o ATO; a cópia de
    artefato que ele produz é outro conceito, e está fora deste mapeamento.
identity:
  external_id_path: oid
  natural_key: [repository.node_id, oid]
attributes:
  sha:              { source_path: oid }
  message_headline: { source_path: messageHeadline }
  message_body:     { source_path: messageBody }
  committed_at:     { source_path: committedDate }
  additions:        { source_path: additions }
  deletions:        { source_path: deletions }
  changed_files:    { source_path: changedFilesIfAvailable }
relations:
  implemented_by:
    source_path: authors.nodes.user.id
    target_ontology: eo
    target_concept: eo.person
    note: >
      **Plural, e isso é essencial.** `authors` (não `author`) traz os co-autores do
      trailer `Co-Authored-By` — no dado real do The Band, cada commit tem duas
      pessoas: quem escreveu e o agente. Coletar só `author` atribuiria a mudança a
      uma pessoa quando o registro nomeia duas. Materializa
      cmpo.stakeholder_performed_commit, cuja cardinalidade de origem é `many`
      exatamente por isso.
  sends_to_target_branch:
    source_path: repository.defaultBranchRef.name
    target_ontology: cmpo
    target_concept: cmpo.target_branch
    note: >
      A branch de destino é a do check-in, e o commit isolado não a carrega: o mesmo
      commit pode estar em várias branches. O caminho aponta para a branch em que ele
      foi observado, e a limitação abaixo diz o que isso significa.
  part_of_change_request:
    source_path: associatedPullRequests.nodes.id
    target_ontology: cmpo
    target_concept: cmpo.change_request
    note: >
      Materializa cmpo.commit_accomplished_change_request. É o elo do meio, e é como o
      rastreio commit → issue funciona **sem depender de menção no texto**: commit → PR
      → closingIssuesReferences → issue.
  mentions_issues:
    source_path: messageBody
    target_ontology: sro
    target_concept: sro.atomic_user_story
    note: >
      Menção de issue na mensagem do commit (`#411`), extraída por padrão. Vínculo
      **mais fraco** que o do PR, e a confiança precisa dizer isso: a mensagem é texto
      livre, e `#411` pode ser referência a outro repositório ou a nada.
derivation:
  rule_id: github.commit_issue_mention
  confidence: low
  inputs: [messageBody, associatedPullRequests]
  precedence: structure_over_declaration
  on_divergence: flag_and_follow_precedence
  fallback: skip
limitations:
  - >
    **As duas relações que faltavam foram declaradas** (issue #426): a participação
    cmpo.stakeholder_performed_commit e a associação
    cmpo.commit_accomplished_change_request, no módulo cmpo.change_traceability.
  - >
    `mentions_issues` aponta para sro.user_story (ou o destino que o roteamento tiver
    decidido) por padrão de TEXTO, e continua sem relação própria: o caminho declarado é
    commit → change_request → item de escopo, e a menção é atalho de confiança baixa.
    Quando os dois discordam, a estrutura vence — com a divergência registrada.
  - >
    **O commit não sabe em qual branch está.** O mesmo `oid` existe em quantas branches
    o tiverem; a branch de destino pertence ao cmpo.checkin, não ao ato isolado. O
    campo grava a branch em que o commit foi OBSERVADO na coleta, e nada mais se
    afirma.
  - >
    `cmpo.artifact_copy` (a cópia versionada de cada arquivo) NÃO é coletada: exigiria
    o diff por arquivo em todo commit, e nada na plataforma o consome. Sem ela,
    `cmpo.commit_sends_copy_to_target_branch` fica com o alvo declarado e a cópia
    ausente — dito, não silenciado.
  - >
    `cmpo.checkin` (o ato composto que inclui verificação de conflito, resolução e
    remoção de branch) não é derivável de commits isolados: precisaria do PR e do
    evento de merge juntos. Fica para quando o consumidor existir.
  - >
    Commit de autor sem conta no GitHub (`user: null`, comum em commits antigos e
    importados) fica com nome e e-mail preservados e sem vínculo com pessoa — a mesma
    regra dos designados e dos comentários. E-mail é dado pessoal: não vai para tela.
  - >
    Menção de issue por padrão de texto tem confiança BAIXA e nunca substitui o
    caminho commit → PR → issue. Quando os dois discordam, a estrutura vence, com a
    divergência registrada.
provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at, schema_version]
