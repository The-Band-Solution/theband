# O Pull Request vira cmpo.change_request — e a definição da ontologia já dizia isso.
#
# `cmpo.change_request` está escrito na CMPO como "solicitação formal para avaliar e
# potencialmente integrar alterações em itens de configuração", com a frase explícita:
# **"Um Pull Request é uma solicitação de mudança — não é o merge, nem a decisão de
# aprovação."** Não há lacuna aqui, e não há o que estender: o mapeamento é
# reconhecimento.
#
# A distinção que a frase protege é a que este mapeamento respeita:
#
#   | o que é                    | conceito                        |
#   |----------------------------|---------------------------------|
#   | o PR aberto (a solicitação)| cmpo.change_request             |
#   | o merge (o ato de integrar)| cmpo.checkin                    |
#   | o fechamento aprovado      | cmpo.change_request_closing     |
#   | quem implementou           | cmpo.change_implementer         |
#
# Achatar os quatro num só registro ("PR mergeado") apagaria a pergunta que o processo
# de gerência de configuração existe para responder: **quem pediu, quem avaliou, quem
# integrou** são papéis distintos, e no dado real do The Band eles coincidem numa pessoa
# só — o que é um achado sobre o processo, não uma propriedade do modelo.
mapping:
  id: github.pull_request.to.cmpo.change_request
  version: 1
  status: proposed
source:
  provider: github
  entity: pull_request
  api: graphql
  schema_version: v4
target:
  ontology: cmpo
  concept: cmpo.change_request
semantics:
  equivalence: total
  justification: >
    Um Pull Request é a solicitação formal de que alterações em cópias de artefato sob
    controle de versão sejam avaliadas e integradas a uma branch de destino — a
    definição literal de cmpo.change_request, que cita o Pull Request como o exemplo.
    A equivalência é total porque o conceito foi escrito reconhecendo esta classe de
    coisa.
identity:
  external_id_path: id
  natural_key: [repository.node_id, number]
attributes:
  number:          { source_path: number }
  title:           { source_path: title }
  body:            { source_path: bodyText }
  state:           { source_path: state }
  opened_at:       { source_path: createdAt }
  merged_at:       { source_path: mergedAt }
  closed_at:       { source_path: closedAt }
  source_branch:   { source_path: headRefName }
  target_branch:   { source_path: baseRefName }
  changed_files:   { source_path: changedFiles }
relations:
  requested_by:
    source_path: author.id
    target_ontology: eo
    target_concept: eo.person
    note: >
      Quem abriu a solicitação. NÃO é necessariamente o cmpo.change_implementer — a
      autoria dos commits é que decide isso, e as duas coisas divergem em revisão
      cruzada e em contribuição externa.
  integrated_by:
    source_path: mergedBy.id
    target_ontology: eo
    target_concept: eo.person
    note: >
      Quem executou o merge. Materializa a participação em cmpo.checkin (o ato de
      integrar), não em cmpo.change_request — e é por isso que vive num campo
      separado de `requested_by`.
  attends_issues:
    source_path: closingIssuesReferences.nodes.id
    target_ontology: sro
    target_concept: sro.atomic_user_story
    note: >
      **O vínculo declarado, e ele é frágil na origem.** Só `closingIssuesReferences`
      conta: é o que o GitHub reconheceu das closing keywords, e não o que o corpo do
      PR parece dizer. Medido em 2026-08-17 no PR #425: o corpo listava 14 issues em
      `Closes #411 #412 …` e o GitHub reconheceu **uma** — a palavra-chave vale para o
      número imediatamente seguinte. O conceito de destino varia com o que a issue foi
      promovida (user story, tarefa, defeito): o vínculo é com o item de escopo, e o
      roteamento de issue já decidiu qual.
  source_branch_ref:
    source_path: headRefName
    target_ontology: cmpo
    target_concept: cmpo.source_branch
  target_branch_ref:
    source_path: baseRefName
    target_ontology: cmpo
    target_concept: cmpo.target_branch
limitations:
  - >
    **A CMPO não declara relação entre cmpo.change_request e eo.person.** Ela tem
    cmpo.change_implementer (o papel) e
    cmpo.change_implementer_in_charge_of_accomplishment (papel → cmpo.change_accomplishment),
    mas nada que ligue a SOLICITAÇÃO a quem a pediu ou a quem a integrou. Os campos
    `requested_by` e `integrated_by` são vínculos que este mapeamento afirma **sem
    relação ontológica declarada** — e dizer isso é o que impede a plataforma de
    apresentá-los como se a rede os sustentasse. A lacuna vale para eo.person nos dois
    papéis, e a decisão de declará-las na CMPO (rede externa, da SEON) é de quem mantém
    o projeto, não deste mapeamento.
  - >
    **Nem entre cmpo.change_request e o item de escopo.** `attends_issues` liga o PR ao
    que a issue foi promovida (sro.atomic_user_story, sro.scrum_development_task,
    rsro.defect conforme o roteamento) e a CMPO não tem essa relação: gerência de
    configuração e escopo são módulos que a rede não costura aqui. Mesma lacuna, mesma
    decisão pendente — e é ela que o rastreio issue → PR → commit atravessa.
  - >
    **Nem entre cmpo.change_request e as branches.** cmpo.source_branch e
    cmpo.target_branch existem como papéis de cmpo.branch, e a única relação declarada é
    cmpo.commit_sends_copy_to_target_branch (do ato de commitar, não da solicitação).
    `source_branch_ref` e `target_branch_ref` ficam como atributos com alvo nomeado, sem
    relação que os sustente.
  - >
    **PR mergeado não é cmpo.change_request "concluída": o merge é outra coisa.** O ato
    de integrar é cmpo.checkin (composto de cmpo.commit_artifact_copy e, quando a
    branch é apagada, cmpo.delete_branch), e o fechamento aprovado é
    cmpo.change_request_closing. Este mapeamento grava `merged_at` e `integrated_by`
    como atributos da solicitação, e a derivação dos dois atos fica para quando algo
    os consumir — declarar isso é o que impede tratar "mergeado" como propriedade do
    pedido.
  - >
    Revisões (approvals, change requests, review threads) NÃO entram: são
    `cmpo.change_control` em outra atividade, e review thread tem âncora em código —
    a mesma lacuna já declarada no mapeamento de comentário.
  - >
    Conflito (cmpo.conflict, cmpo.artifact_copy_with_conflict) não é coletável pela
    API de PR: o GitHub expõe `mergeable`, que é o estado de AGORA, não o histórico de
    conflitos resolvidos. Afirmar cmpo.resolve_conflict a partir dele seria inventar.
  - >
    `closingIssuesReferences` só existe no GraphQL. A API REST de PR não traz o
    vínculo com issue — quem coletar por REST fica sem o elo, e a ausência precisa ser
    dita em vez de virar "PR sem issue".
  - >
    Menção de issue no corpo sem closing keyword (`Refs #318`) é vínculo mais fraco e
    fica FORA: promovê-lo ao mesmo conceito faria "mencionou" e "atende" a mesma
    coisa. Se um dia sustentar decisão, é conceito próprio.
provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at, schema_version]
