mapping:
  id: github.repository.to.cmpo.source_repository
  version: 3
  status: proposed
source: { provider: github, entity: repository, api: graphql, schema_version: v4 }
target: { ontology: cmpo, concept: cmpo.source_repository }
semantics:
  equivalence: partial
  justification: >
    Um repositório do GitHub é uma cópia carregada de sistema de software cujo
    propósito é tratar mudanças de cópias de artefato — exatamente o papel do
    Source Repository em CMPO. Não é o projeto de software (SPO) nem o produto
    (SysSwO); um projeto pode ter vários repositórios.

    Parcial, e não total: um repositório do GitHub também hospeda issues, wiki e
    execuções de CI, que estão fora do que o conceito cobre. O que sobra é
    mapeado por outros mapeamentos — issue vai para SRO —, e o que não é mapeado
    por nenhum permanece só no payload preservado.

    Atravessa a fronteira de ontologia: cmpo.source_repository é subkind de
    sys_swo.loaded_software_system_copy, logo materializa por REFERÊNCIA — valor
    de discriminador na tabela daquele kind, com extensão em CMPO para os
    atributos próprios. Constituição IX, a regra da fronteira.
identity:
  external_id_path: id
  natural_key: [owner.login, name]
attributes:
  name:                { source_path: name }
  qualified_name:      { source_path: nameWithOwner }
  url:                 { source_path: url }
  description:         { source_path: description }
  primary_language:    { source_path: primaryLanguage.name }
  default_branch:      { source_path: defaultBranchRef.name }
  archived_at:         { source_path: archivedAt }
  external_created_at: { source_path: createdAt }
  last_pushed_at:      { source_path: pushedAt }
relations:
  owner:
    source_path: owner.id
    target_ontology: eo
    target_concept: eo.organization
limitations:
  - >
    O proprietário aponta para eo.organization, e a relação entre
    cmpo.source_repository e eo.organization AINDA não está declarada na base. A
    direção CMPO → EO é permitida — vai do específico para o geral —, mas declarar
    a relação é passo próprio, como foi eo.organizational_team_belongs_to_organization
    na feature 002. Até lá o vínculo existe no mapeamento e não no modelo derivado.
  - >
    Repositório NÃO é projeto; não derivar spo.software_project automaticamente
    daqui. O projeto de software vem do Projects v2, por mapeamento próprio — um
    projeto pode ter vários repositórios, e um repositório pode servir a vários
    projetos.
  - Forks e mirrors representam o mesmo item de configuração em instâncias diferentes.
  - >
    `isFork` NÃO é coletado como booleano, de propósito. Ser fork é dizer que esta
    cópia deriva de OUTRA cópia — é relação, não propriedade. Um booleano seria o
    antipadrão "booleano no lugar do relator" nomeado no AGENTS.md §7.7: guardaria
    que existe origem e perderia qual é. Fica pendente até a relação
    cópia-deriva-de-cópia ser declarada em CMPO.
  - >
    `languages` — a lista com todas as linguagens — não é coletada. Só
    `primaryLanguage` é, e como atributo do repositório. A lista completa exigiria um
    conceito próprio para linguagem, e uma relação com peso por linguagem; sem isso
    seria um array sem semântica declarada.
  - >
    `primary_language` é calculada pela ORIGEM sobre o código, e não é propriedade da
    cópia carregada em si. Registrada no repositório porque é onde a origem a
    fornece, com a atribuição declarada aqui em vez de presumida.
  - >
    `licenseInfo` e `diskUsage` não são coletados: licença é conceito de outra
    ontologia, e tamanho em disco é métrica da hospedagem, não do item de
    configuração.
  - >
    `default_branch` guarda o NOME do ramo, não uma referência a `cmpo.branch`. A
    relação existiria — `cmpo.branch_belongs_to_repository` já está declarada —, mas
    apontar para ela exigiria coletar ramos, que está fora do escopo desta feature.
  - >
    `archivedAt` diz que a ORIGEM arquivou, e isso não é ausência. Repositório
    arquivado continua observado, e suas issues continuam consultáveis. Confundir
    os dois faria a plataforma marcar como não mais observado o que ela vê muito
    bem — e a exclusão decidida pelo tenant é uma TERCEIRA coisa, que vive na
    camada de plataforma porque é decisão e não fato do mundo.
provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at]
