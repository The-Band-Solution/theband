mapping:
  id: github.issue.user_story.to.sro.atomic_user_story
  version: 2
  status: proposed
source:
  provider: github
  entity: issue
  api: graphql
  schema_version: v4
  selector:
    field: issueType.name
    rule_ref: github.issue_type_routing
    values: ["User Story", "História de Usuário", "Story", "Feature"]
    structural_requirements:
      has_children: false
derivation:
  rule_id: github.issue_type_routing
  confidence: medium
  inputs: [issueType.name, subIssues, parent.id]
  precedence: structure_over_declaration
  on_divergence: flag_and_follow_precedence
  fallback: skip
target:
  ontology: sro
  concept: sro.atomic_user_story
semantics:
  equivalence: derived
  justification: >
    Uma issue promovida a user story atômica descreve um requisito do produto e
    não é decomposta em outras user stories. É o nível em que tarefas de
    desenvolvimento se ligam ao escopo (sro.rule07) e em que entregáveis
    materializam requisitos — por isso a distinção entre atômica e épico não é
    cosmética.
identity:
  external_id_path: id
  natural_key: [repository.node_id, number]
attributes:
  title:      { source_path: title }
  body:       { source_path: body }
relations:
  author:
    source_path: author.id
    target_ontology: eo
    target_concept: eo.person
  part_of_epic:
    source_path: parent.id
    target_ontology: sro
    target_concept: sro.epic
limitations:
  - Issue com sub-issues que também são user stories é épico, não atômica — a estrutura vence o tipo declarado.
  - Sub-issues do tipo Task não descaracterizam a user story como atômica; tarefas a atendem, não a compõem.
  - Critérios de aceitação escritos no corpo em texto livre não são sro.acceptance_criterion até serem extraídos e validados; a extração não faz parte deste mapeamento.
  - >
    `importance` e `complexity` ficam NULAS, e a versão 1 deste mapeamento as lia
    de `fieldValueByName(Priority)` e `fieldValueByName(Estimate)`. Duas coisas
    erradas ali, corrigidas na versão 2.

    A primeira: `Priority` NÃO é `importance`. Importance é decimal com escala
    declarada — "quão valiosa a user story é para a organização" —, e Priority é
    seleção única cujos valores o tenant inventou (P0, P1, P2). Converter um no
    outro é mapeamento por semelhança de nome, que o princípio I proíbe e o
    AGENTS.md §7.7 nomeia como antipadrão. O quadro real deste tenant não tem
    campo numérico de importância, e a ausência fica declarada em vez de
    substituída.

    A segunda: `fieldValueByName` identifica o campo pelo NOME. Renomear "Priority"
    para "Prioridade" quebraria o mapeamento em silêncio. A identidade de um campo
    configurável é o identificador dele — FR-027 da feature 004 —, e o mapeamento
    campo→atributo passa a ser declarado por tenant em `rules/tenants/`.
  - >
    Uma issue marcada `Epic` SEM sub-issues cai aqui, e a divergência entre tipo
    declarado e conceito derivado fica registrada. Não existe épico sem partes
    (sro.rule05), e a divergência costuma significar épico abandonado sem
    decomposição.
  - >
    Sub-issues do tipo `Task` NÃO tornam a issue épica: tarefa ATENDE user story
    (sro.intended_task_planned_to_meet_user_story), não a compõe. É o erro mais
    fácil de cometer nesta regra.
  - >
    Sem a API de sub-issues — GitHub Enterprise Server antigo — a distinção
    épico/atômica NÃO é feita, e isso é declarado em vez de suprido por heurística
    de lista em markdown.
  - >
    Critério de aceitação não é extraído do corpo. `sro.acceptance_criterion`
    consta como não observável na matriz de cobertura; extrair por heurística
    produziria critério plausível e errado.
  - Feature e User Story são tratadas como o mesmo destino, o que pode ser incorreto em organizações que usam Feature como agrupador — confirmar por tenant.
provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at]
