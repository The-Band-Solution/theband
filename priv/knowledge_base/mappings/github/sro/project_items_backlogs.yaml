mapping:
  id: github.project_items.to.sro.backlogs
  version: 1
  status: proposed
source:
  provider: github
  entity: project_v2_item
  api: graphql
  schema_version: v4
  selector:
    field: fieldValueByName.iteration
    rule_ref: github.item_iteration_assignment
derivation:
  rule_id: github.item_iteration_assignment
  confidence: medium
  inputs: [content.id, fieldValueByName.iteration.iterationId, project.id]
  fallback: skip
target:
  ontology: sro
  concept: sro.product_backlog
semantics:
  equivalence: derived
  justification:
    pt-BR: >
      Nem o product backlog nem o sprint backlog são objetos que o GitHub tenha. Os
      dois são CONJUNTOS de itens, e o que separa um do outro é uma única coisa: a
      atribuição de iteração.

        sem iteração atribuída          → product backlog
        iteração atribuída, já iniciada → sprint backlog daquele sprint

      A composição é derivada da atribuição, e NUNCA gravada como pertencimento
      escolhido por quem coleta. Gravá-la seria o mesmo erro que materializar a
      classificação épico/atômica: no instante em que alguém arrastasse um item no
      quadro, o registro divergiria da origem.

      Consequência verificável: a soma dos itens no product backlog e nos sprint
      backlogs de um projeto é igual ao total de itens dele. Nenhum item nos dois
      conjuntos, nenhum fora dos dois.
    en: |
      Neither the product backlog nor the sprint backlog is an object that GitHub has. Both are SETS of items, and what separates one from the other is a single thing: the iteration assignment.

        no iteration assigned                → product backlog
        iteration assigned, already started  → sprint backlog of that sprint

      The composition is derived from the assignment, and NEVER stored as membership chosen by whoever collects. Storing it would be the same mistake as materializing the epic/atomic classification: the instant someone dragged an item on the board, the record would diverge from the origin.
      Verifiable consequence: the sum of the items in the product backlog and in the sprint backlogs of a project equals its total number of items. No item in both sets, none outside both.
identity:
  external_id_path: id
  natural_key: [project.id, content.id]
relations:
  contains_user_story:
    source_path: content.id
    target_ontology: sro
    target_concept: sro.user_story
  part_of_sprint_backlog:
    source_path: fieldValueByName.iteration.iterationId
    target_ontology: sro
    target_concept: sro.sprint_backlog
    note: >
      Só quando a iteração já começou. Item atribuído a iteração futura permanece
      no product backlog: o sprint dela não existe ainda.
limitations:
  - pt-BR: >
      Item RASCUNHO não tem issue por trás, e não é promovido a nada. Ele é
      registrado como item sem trabalho associado — um rascunho no quadro é intenção
      de alguém, não escopo do produto.
    en: >
      A DRAFT item has no issue behind it, and is not promoted to anything. It is recorded
      as an item without associated work — a draft on the board is someone's intention, not
      product scope.
  - pt-BR: >
      A ordem DENTRO do backlog não é coletada como ordem. sro.user_story.importance
      é decimal, e o quadro deste tenant não tem campo numérico — a ausência fica
      declarada, e nenhum outro campo é usado como substituto.
    en: >
      The order WITHIN the backlog is not collected as order. sro.user_story.importance is a
      decimal, and this tenant's board has no numeric field — the absence is declared, and
      no other field is used as a substitute.
  - pt-BR: >
      O MOMENTO em que o item entrou na iteração não é coletado, e é ele que a matriz
      de cobertura pede para derivar sro.intended_scrum_development_task com confiança
      baixa. Exigiria o histórico de itens, fora de escopo por custo.
    en: >
      The MOMENT at which the item entered the iteration is not collected, and it is what
      the coverage matrix asks for in order to derive sro.intended_scrum_development_task
      with low confidence. It would require the item history, out of scope due to cost.
  - pt-BR: >
      Um item pode estar em mais de um quadro. Nesse caso a mesma user story aparece
      em mais de um backlog, o que a SRO não proíbe e ninguém deveria interpretar
      como duplicação.
    en: >
      An item may be on more than one board. In that case the same user story appears in
      more than one backlog, which the SRO does not forbid and which no one should interpret
      as duplication.
  - pt-BR: >
      Iteração removida da configuração deixa seus itens sem iteração vigente. Eles
      NÃO voltam ao product backlog automaticamente: voltar afirmaria uma decisão de
      replanejamento que ninguém tomou.
    en: >
      An iteration removed from the configuration leaves its items without an in-force
      iteration. They do NOT return to the product backlog automatically: returning would
      assert a replanning decision that no one made.
provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at]
