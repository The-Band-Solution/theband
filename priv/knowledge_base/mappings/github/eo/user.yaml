mapping:
  id: github.user.to.eo.person
  version: 1
  status: proposed
source:
  provider: github
  entity: user
  api: graphql
  schema_version: v4
target:
  ontology: eo
  concept: eo.person
semantics:
  equivalence: partial
  justification: >
    Uma conta de usuário do GitHub identifica um agente que atuou no repositório.
    Não é a pessoa: uma pessoa pode ter várias contas, e uma conta pode ser um bot
    ou uma conta de serviço. A identidade de pessoa exige reconciliação explícita.
identity:
  external_id_path: id
  natural_key: [login]
attributes:
  name:  { source_path: name }
relations:
  organization:
    source_path: organization.id
    target_ontology: eo
    target_concept: eo.organization
limitations:
  - Contas do tipo Bot e App não são pessoas e devem ser classificadas separadamente.
  - A mesma pessoa pode ter múltiplas contas; a unificação exige regra explícita, nunca heurística de nome.
  - O e-mail não é coletado. O campo existe na API, mas exige o escopo read:user ou user:email, mais amplo do que a coleta precisa, e costuma vir nulo por configuração de privacidade. Pedir escopo maior por um campo quase sempre vazio amplia a superfície de acesso sem contrapartida. Consequência - eo.person.email permanece nulo quando a fonte é o GitHub, e qualquer análise que dependa de e-mail não é respondível a partir dela.
provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at]
