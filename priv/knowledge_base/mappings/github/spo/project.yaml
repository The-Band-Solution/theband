mapping:
  id: github.project_v2.to.spo.software_project
  version: 1
  status: proposed
source:
  provider: github
  entity: project_v2
  api: graphql
  schema_version: v4
target:
  ontology: spo
  concept: spo.software_project
semantics:
  equivalence: partial
  justification: >
    Decisão da pessoa mantenedora, 2026-08-11: a correspondência é direta — um
    project do GitHub é um projeto de software.

    Parcial, e a razão está declarada nas limitações: o Projects v2 é um quadro de
    planejamento, e uma organização mantém mais de um quadro para o mesmo
    empreendimento. A plataforma contará quadros.

    A alternativa considerada e recusada era exigir declaração do tenant para toda
    promoção. Ela deixaria projeto não declarado INVISÍVEL a todas as consultas de
    escopo, e lacuna silenciosa é pior que imprecisão medida.

    A promoção a sro.scrum_project NÃO acontece aqui, e não por cautela: adotar
    Scrum não é observável. Um projeto com iterações pode ser Kanban com recorte
    temporal. Aquela promoção exige declaração, com confiança média, como a matriz
    de cobertura já registrava.
identity:
  external_id_path: id
  natural_key: [owner.login, number]
attributes:
  name:       { source_path: title }
  started_at: { source_path: createdAt }
  ended_at:   { source_path: closedAt }
relations:
  owned_by_organization:
    source_path: owner.id
    target_ontology: eo
    target_concept: eo.organization
limitations:
  - >
    Quadro não é empreendimento. Esta organização tem dois quadros — `The Band` e
    `Zeppelin` — e a plataforma registrará dois projetos de software. Se eles são
    dois empreendimentos ou um, o GitHub não diz.
  - >
    O inverso também vale: um quadro pode conter itens de repositórios de
    empreendimentos diferentes, porque o Projects v2 aceita item de qualquer
    repositório alcançável.
  - >
    `started_at` vem de `createdAt` — quando o QUADRO foi criado, não quando o
    projeto começou. As duas coisas divergem, e a segunda o GitHub não sabe.
  - >
    `ended_at` vem de `closedAt`. Quadro fechado não é projeto terminado: times
    fecham quadro ao migrar de ferramenta.
  - Projeto de usuário, fora de organização, não é coletado.
  - >
    O vínculo com eo.organization existe no mapeamento e NÃO no modelo derivado:
    não há relação declarada entre spo.software_project e eo.organization na base.
    Declará-la é passo próprio, como foi eo.organizational_team_belongs_to_organization
    na feature 002 — e a direção SPO → EO é permitida, vai do específico para o
    geral. Até lá, a organização do projeto é rastreável pela ferramenta conectada
    que o observou, e não por chave estrangeira derivada.
provenance:
  preserve_raw_payload: true
  required_fields: [source_system, source_instance, external_id, collected_at]
