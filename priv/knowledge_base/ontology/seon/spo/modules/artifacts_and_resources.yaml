module:
  id: spo.artifacts_and_resources
  ontology: spo
  name: Artifacts and Resources
  version: 1.0.0
  provenance:
    source_type: reference_ontology
    reference: "Tese, Seção 2.2.2.1, Figuras 16 e 17"

concepts:
  - id: spo.artifact
    name: Artifact
    label: { pt-BR: "Artefato", en: "Artifact" }
    definition:
      pt-BR: Objeto criado, usado ou alterado por atividades executadas do processo.
      en: "Object created, used or changed by performed activities of the process."
    classification: { ufo_category: object, ontouml_stereotype: category }

  - id: spo.information_item
    name: Information Item
    label: { pt-BR: "Item de Informação", en: "Information Item" }
    definition:
      pt-BR: Informação relevante para uso humano no contexto do processo de software.
      en: "Information relevant for human use in the context of the software process."
    classification: { ufo_category: social_object, ontouml_stereotype: kind, parent: spo.artifact }
    examples: ["um bug reportado", "um requisito documentado"]

  - id: spo.document
    name: Document
    label: { pt-BR: "Documento", en: "Document" }
    definition:
      pt-BR: >
        Informação escrita ou pictórica, unicamente identificada, relacionada ao
        processo de software, geralmente em formato predefinido. Um documento
        descreve artefatos; não é o artefato descrito.
      en: >
        Written or pictorial information, uniquely identified, related to the software
        process, usually in a predefined format. A document describes artifacts; it is not
        the described artifact.
    classification: { ufo_category: social_object, ontouml_stereotype: subkind, parent: spo.information_item }
    examples: ["uma Especificação de Projeto"]

  - id: spo.resource
    name: Resource
    label: { pt-BR: "Recurso", en: "Resource" }
    definition:
      pt-BR: >
        Papel assumido por um artefato — produto de software ou equipamento de
        hardware — quando é usado por uma atividade do processo. As especializações
        que apontam para conceitos de SysSwO vivem em SysSwO, e não aqui, para
        preservar a direção de dependência (SysSwO depende de SPO, não o contrário).
      en: >
        Role played by an artifact — software product or hardware equipment — when it is
        used by an activity of the process. The specializations that point to SysSwO
        concepts live in SysSwO, and not here, to preserve the direction of dependency
        (SysSwO depends on SPO, not the other way around).
    classification: { ufo_category: role, ontouml_stereotype: role_mixin, is_role_of: spo.artifact }


relations:
  - id: spo.activity_creates_artifact
    name: creates
    label: { pt-BR: "cria" }
    source: spo.performed_project_activity
    target: spo.artifact
    type: association
    cardinality: { source: many, target: many }

  - id: spo.activity_uses_artifact
    name: uses
    label: { pt-BR: "usa" }
    source: spo.performed_project_activity
    target: spo.artifact
    type: association
    cardinality: { source: many, target: many }

  - id: spo.activity_changes_artifact
    name: changes
    label: { pt-BR: "altera" }
    source: spo.performed_project_activity
    target: spo.artifact
    type: association
    cardinality: { source: many, target: many }

  - id: spo.document_describes_artifact
    name: describes
    label: { pt-BR: "descreve" }
    source: spo.document
    target: spo.artifact
    type: association
    cardinality: { source: many, target: many }

  - id: spo.activity_uses_resource
    name: uses resource
    label: { pt-BR: "usa recurso" }
    source: spo.performed_project_activity
    target: spo.resource
    type: association
    cardinality: { source: many, target: many }
