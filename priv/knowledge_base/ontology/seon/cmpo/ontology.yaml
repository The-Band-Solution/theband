ontology:
  id: cmpo
  name: Configuration Management Process Ontology
  acronym: CMPO
  version: 1.1.0
  namespace: the_band.ontology.seon.cmpo
  layer: domain
  network: seon
  description:
    pt-BR: >
      Atividades, artefatos e stakeholders do processo de gerência de configuração.
      Inclui a extensão desenvolvida na tese para alinhar CMPO à filosofia do Git
      (branches, conflitos, commit), necessária para desenvolver CIRO.
dependencies: [ufo, spo, sys_swo]
modules:
  - configuration_management_process
  - checkout
  - checkin
  - change_traceability
provenance:
  source_type: reference_ontology
  reference: "Tese, Seções 2.2.2.2 e 3.3.1 (Figuras 18, 32 e 33)"
  authors: ["Calhau, R. F.", "Falbo, R. A."]
  year: 2012
  note: >
    A versão original de CMPO é alinhada à filosofia do Subversion. A tese estendeu
    a ontologia para representar check-in e check-out como ocorrem no Git.

    E o projeto The Band acrescentou uma terceira camada, o módulo change_traceability
    (2026-08-17, issue #426): as participações que ligam stakeholders aos atos —
    submeter, integrar, commitar. Elas faltavam, e a lacuna apareceu ao escrever o
    mapeamento do Pull Request, antes de qualquer coleta.
