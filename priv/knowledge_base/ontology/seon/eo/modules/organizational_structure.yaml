module:
  id: eo.organizational_structure
  ontology: eo
  name: Organizational Structure
  version: 1.0.0
  description:
    pt-BR: >
      Organizações, pessoas, equipes e papéis. O ponto central é que ser membro de
      equipe não é uma propriedade da pessoa: é um papel alocado por uma relação
      contextual (Team Membership).
  provenance:
    source_type: reference_ontology
    reference: "Tese, Seção 2.2.2.1, Figura 16"

concepts:
  - id: eo.organization
    name: Organization
    label: { pt-BR: "Organização", en: "Organization" }
    definition:
      pt-BR: Agente social que reconhece papéis organizacionais e emprega pessoas.
    classification: { ufo_category: social_agent, ontouml_stereotype: kind }

  - id: eo.organizational_unit
    name: Organizational Unit
    label: { pt-BR: "Unidade Organizacional", en: "Organizational Unit" }
    definition:
      pt-BR: >
        Agente social interno a uma organização, com responsabilidades próprias,
        que não constitui uma organização em si. Um departamento, uma diretoria,
        uma gerência. Diferentemente de uma organização, não existe fora daquela
        que o contém: extinta a organização, a unidade não sobrevive a ela.
    classification: { ufo_category: social_agent, ontouml_stereotype: kind }
    examples:
      - "a diretoria de tecnologia de uma empresa"
      - "o departamento de qualidade"
    provenance:
      source_type: project_decision
      note: >
        Chamava-se eo.sector até 2026-08-10. Renomeado por decisão da pessoa
        mantenedora, alinhando o vocabulário ao uso corrente em modelagem
        corporativa — em ArchiMate, "organizational unit" é o agente concreto,
        não um papel. O conceito, a categoria UFO e o critério de identidade
        permanecem os mesmos; mudou o nome, não o que ele significa.

  - id: eo.organizational_part
    name: Organizational Part
    label: { pt-BR: "Parte Organizacional", en: "Organizational Part" }
    definition:
      pt-BR: >
        Papel assumido por uma organização ou por uma unidade organizacional
        quando é parte de uma organização maior. Não é um tipo de organização: é
        a posição ocupada numa estrutura.

        Classifica indivíduos de dois kinds distintos — uma subsidiária é uma
        organização que é parte da matriz, enquanto um departamento é uma unidade
        organizacional que é parte da mesma organização. Por isso é não-sortal, e
        por isso é antirrígido: uma reestruturação desfaz a posição sem destruir a
        organização ou a unidade que a ocupava.
    classification: { ufo_category: social_role, ontouml_stereotype: role_mixin, is_role_of: ufo.agent }
    examples:
      - "uma subsidiária, que é organização e parte da matriz"
      - "o departamento de qualidade, que é unidade organizacional e parte da organização"
    provenance:
      source_type: project_decision
      note: >
        Chamava-se eo.organizational_unit até 2026-08-10. O nome foi cedido ao
        kind que hoje se chama assim; este conceito ficou com um nome tirado da
        própria definição, que fala em "ser parte de uma organização maior". A
        distinção que ele carrega — kind fornece identidade, role_mixin classifica
        indivíduos de kinds distintos — permanece intacta.

  - id: eo.person
    name: Person
    label: { pt-BR: "Pessoa", en: "Person" }
    definition:
      pt-BR: >
        Agente humano. É o conceito de identidade das pessoas em toda a rede:
        SRO, CIRO e CDRO referenciam pessoas apenas por meio de papéis.
    classification: { ufo_category: agent, ontouml_stereotype: kind }
    attributes:
      - { name: name, type: string, required: true }
      - { name: email, type: string, required: false }

  - id: eo.organizational_role
    name: Organizational Role
    label: { pt-BR: "Papel Organizacional", en: "Organizational Role" }
    definition:
      pt-BR: >
        Papel social reconhecido pela organização, atribuído a agentes quando são
        contratados, incluídos em uma equipe, alocados ou participam de atividades.
    classification: { ufo_category: social_role, ontouml_stereotype: kind, is_role_of: ufo.agent }
    examples: ["gerente de projeto", "designer", "programador"]

  - id: eo.team
    name: Team
    label: { pt-BR: "Equipe", en: "Team" }
    definition:
      pt-BR: Coletivo de pessoas que desempenham papéis organizacionais em conjunto.
    classification: { ufo_category: collective, ontouml_stereotype: kind }

  - id: eo.organizational_team
    name: Organizational Team
    label: { pt-BR: "Equipe Organizacional", en: "Organizational Team" }
    definition:
      pt-BR: Equipe ligada a uma organização, e não a um projeto específico.
    classification: { ufo_category: collective, ontouml_stereotype: subkind, parent: eo.team }
    examples: ["a equipe de marketing de uma organização de software"]

  - id: eo.project_team
    name: Project Team
    label: { pt-BR: "Equipe de Projeto", en: "Project Team" }
    definition:
      pt-BR: Equipe ligada a um projeto.
    classification: { ufo_category: collective, ontouml_stereotype: subkind, parent: eo.team }
    examples: ["a equipe de desenvolvimento de um projeto"]

  - id: eo.team_member
    name: Team Member
    label: { pt-BR: "Membro de Equipe", en: "Team Member" }
    definition:
      pt-BR: >
        Pessoa ligada a uma equipe, desempenhando nela um papel organizacional.

        É papel, não tipo. Em UFO, um papel é um sortal antirrígido que
        especializa o kind que lhe dá identidade: quem é membro de equipe é,
        antes de tudo, uma pessoa — e continua sendo a mesma pessoa ao deixar a
        equipe. Por isso a identidade fica em eo.person, e o vínculo com a equipe
        vive em eo.team_membership, que carrega equipe, papel e período.

        A mesma pessoa pode ser membro de várias equipes ao mesmo tempo, com
        papéis diferentes em cada uma.
    classification: { ufo_category: role, ontouml_stereotype: role, is_role_of: eo.person }

  - id: eo.team_membership
    name: Team Membership
    label: { pt-BR: "Alocação em Equipe", en: "Team Membership" }
    definition:
      pt-BR: >
        Relação social que aloca um membro de equipe para desempenhar um papel
        organizacional em uma equipe. É o relator que conecta pessoa, papel e
        equipe — e o lugar onde vive a temporalidade da alocação.
    classification: { ufo_category: relator, ontouml_stereotype: relator, is_role_of: eo.person }
    attributes:
      - { name: started_at, type: datetime, required: false }
      - { name: ended_at, type: datetime, required: false }
    examples:
      - "A alocação de John como programador na equipe de desenvolvimento do projeto X."

relations:
  - id: eo.organization_part_of_organization
    name: is part of
    label: { pt-BR: "é parte de", en: "is part of" }
    source: eo.organization
    target: eo.organization
    type: part_whole
    cardinality: { source: many, target: zero_or_one }
    temporal: { type: historical_relation }
    semantics:
      description: >
        Uma organização pode ser parte de outra — é o caso da subsidiária dentro
        do grupo. É relação de parthood, não de generalização: a subsidiária não
        é um tipo de matriz, é uma organização que ocupa posição na estrutura da
        matriz. Por ser contingente, admite início e fim.

  - id: eo.organizational_unit_part_of_organization
    name: is part of
    label: { pt-BR: "é parte de", en: "is part of" }
    source: eo.organizational_unit
    target: eo.organization
    type: part_whole
    cardinality: { source: many, target: one }
    semantics:
      description: >
        Toda unidade organizacional é parte de exatamente uma organização, e não
        existe fora dela. A cardinalidade obrigatória no destino é o que a
        distingue de uma organização: uma organização pode não ser parte de nada.

  - id: eo.organizational_team_belongs_to_organization
    name: belongs to
    label: { pt-BR: "pertence a", en: "belongs to" }
    source: eo.organizational_team
    target: eo.organization
    type: association
    cardinality: { source: many, target: one }
    semantics:
      description: >
        Uma equipe organizacional pertence a exatamente uma organização, e uma
        organização tem várias. A definição de eo.organizational_team já afirmava
        esse vínculo em prosa; declará-lo não inventa semântica, torna explícito o
        que o conceito diz de si.

        Parte do subkind e não do kind: eo.project_team liga-se a um projeto — um
        conceito de SPO —, não a uma organização. Pôr a relação em eo.team
        obrigaria toda equipe de projeto a ter organização, o que é falso em
        projeto entre organizações.

        É association e não part_whole. Uma equipe é coletivo de pessoas; a
        organização é agente social. "Pertence a" não é "é parte de", e a distinção
        entre eo.organizational_unit — que é parte — e eo.organizational_team é
        justamente essa. Declará-la como parthood faria o derivador gerar a chave
        estrangeira sem esforço, ao custo de apagar a distinção.
    provenance:
      source_type: project_decision
      note: >
        Acréscimo da feature 002, achado F4 da análise ontológica — não vem de SEON,
        e é por isso que declara proveniência própria: o módulo é reference_ontology,
        e sem esta marca a relação apareceria como se a referência a tivesse
        declarado.

        A ausência dela é a causa raiz do defeito que a feature corrige: as colunas
        eo_teams.organization_id e eo_people.organization_id foram escritas à mão na
        migração da feature 001, sem existir no modelo derivado, contra a ADR 0004
        D4. A relação vem antes da coluna.

  - id: eo.recognizes
    name: recognizes
    label: { pt-BR: "reconhece" }
    source: eo.organization
    target: eo.organizational_role
    type: association
    cardinality: { source: one, target: many }

  - id: eo.membership_allocates_member
    name: allocates
    label: { pt-BR: "aloca" }
    source: eo.team_membership
    target: eo.team_member
    type: association
    cardinality: { source: one, target: one }

  - id: eo.membership_to_team
    name: allocates to team
    label: { pt-BR: "aloca na equipe" }
    source: eo.team_membership
    target: eo.team
    type: association
    cardinality: { source: many, target: one }

  - id: eo.membership_to_play_role
    name: to play
    label: { pt-BR: "para desempenhar" }
    source: eo.team_membership
    target: eo.organizational_role
    type: association
    cardinality: { source: many, target: one }

  - id: eo.team_member_is_person
    name: is played by
    label: { pt-BR: "é desempenhado por" }
    source: eo.team_member
    target: eo.person
    type: association
    cardinality: { source: many, target: one }
    temporal: { type: historical_relation }
