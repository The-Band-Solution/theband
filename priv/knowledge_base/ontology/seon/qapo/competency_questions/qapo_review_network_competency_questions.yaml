ontology: qapo
subontology: review_network
provenance:
  source_type: project_decision
  year: 2026
  reference: "spec 073, FR-002, FR-004 e FR-007; proposta de base em specs/073-rede-de-revisao/proposta-base/; revisão semântica 073/T003"
  note: >
    Primeiras perguntas de competência da QAPO, que não tinha nenhuma. Não vêm da tese:
    são as que a rede de revisão precisa que a rede de ontologias responda, escritas antes
    do código para que a derivação da aresta tenha contra o que ser verificada.

    O prefixo `qapo_review_network` nos ids, e não `qapo`, é deliberado: deixa `qapo.cqNN`
    livre para as perguntas que vierem da própria QAPO, sem colisão.

    **Só vocabulário de QAPO e SPO, de propósito** (revisão semântica 073/T003). A QAPO
    depende de `[ufo, spo]`, e não de CMPO nem, diretamente, de EO — é a decisão que
    `qapo.evaluation_participation` e o mapeamento `review.yaml` registram para não inverter
    a rede. A primeira versão destas perguntas citava `cmpo.change_request`,
    `cmpo.stakeholder_submitted_change_request` e `eo.person`: nenhum validador reprova
    isso, e por isso mesmo a dependência entraria escondida. Todas as outras seis
    ontologias com perguntas de competência citam só o que declaram.

    O lado do autor se escreve em SPO: a pessoa participou (`spo.participates_in`) da
    atividade que criou o artefato (`spo.activity_creates_artifact`). No The Band, o
    artefato é a solicitação de mudança, a atividade é a submissão
    (`cmpo.change_request_submission`, que é `spo.performed_simple_activity`), e a
    participação é `cmpo.stakeholder_submitted_change_request`, que especializa
    `spo.participates_in`. O percurso concreto, com os ids da CMPO, está na regra global
    `review.network.edge`, que pode atravessar as duas ontologias sem que uma dependa da
    outra.

competency_questions:
  - id: qapo_review_network.cq01
    question:
      pt-BR: "Quais pessoas avaliaram um artefato criado em atividade de que participou outra pessoa, numa janela de tempo? (No The Band: quem revisou a solicitação de mudança submetida por outra pessoa.)"
      en: "Which people evaluated an artifact created by an activity another person took part in, within a time window? (In The Band: who reviewed a change request submitted by another person.)"
    concepts:
      [spo.project_person_stakeholder, qapo.artifact_evaluation, qapo.evaluated_artifact,
       spo.artifact, spo.performed_project_activity]
    relations:
      [qapo.stakeholder_performed_artifact_evaluation, qapo.artifact_evaluation_evaluates,
       spo.participates_in, spo.activity_creates_artifact]
    expected_query_type: list
    rationale: >
      É a pergunta que define a aresta. Se a rede de ontologias não a responde, a aresta
      revisor → autor é invenção do código, e não leitura da base. A resposta exige os dois
      lados: quem participou da avaliação e quem participou da atividade que CRIOU o
      artefato — a submissão, e não a integração, porque Pull Request não é merge (a
      integração é `cmpo.checkin`, que não cria a solicitação).

  - id: qapo_review_network.cq02
    question:
      pt-BR: "Quantos artefatos distintos criados em atividade de uma pessoa foram avaliados por outra, numa janela de tempo?"
      en: "How many distinct artifacts created by an activity of one person were evaluated by another, within a time window?"
    concepts: [spo.project_person_stakeholder, qapo.artifact_evaluation, spo.artifact]
    relations:
      [qapo.stakeholder_performed_artifact_evaluation, qapo.artifact_evaluation_evaluates,
       spo.participates_in, spo.activity_creates_artifact]
    attributes: [submitted_at]
    expected_query_type: count
    rationale: >
      É o peso da aresta. Artefatos (solicitações) DISTINTOS, e não avaliações: várias
      rodadas da mesma pessoa sobre o mesmo artefato são uma contribuição só. Sem esta
      pergunta, o peso vira contagem de eventos e infla quem comenta muito em poucas
      solicitações.

  - id: qapo_review_network.cq03
    question:
      pt-BR: "Quais avaliações de artefato não ligam duas pessoas distintas — a que avaliou e a que participou da criação do artefato —, e por qual motivo?"
      en: "Which artifact evaluations do not link two distinct people — the evaluator and a participant in the artifact's creation —, and for what reason?"
    concepts: [spo.project_person_stakeholder, qapo.artifact_evaluation, spo.artifact]
    relations:
      [qapo.stakeholder_performed_artifact_evaluation, spo.participates_in,
       spo.activity_creates_artifact]
    attributes: [account_type, author_type, state]
    expected_query_type: aggregate
    rationale: >
      As exclusões precisam ser respondíveis pela base, e não só pelo cálculo: auto-revisão
      (a mesma pessoa nas duas pontas), conta de máquina, e conta sem pessoa ligada. Sem a
      pergunta, uma revisão excluída some — e a soma das arestas deixa de fechar com o total
      de revisões, que é o que permite conferir a leitura contra a origem (SC-001).

  - id: qapo_review_network.cq04
    question:
      pt-BR: "Entre as pessoas que avaliaram, ou participaram da criação de artefato avaliado, numa janela, quais conjuntos não estão ligados por avaliação em sentido nenhum?"
      en: "Among the people who evaluated, or took part in creating an evaluated artifact, in a window, which sets are not linked by evaluation in either direction?"
    concepts: [spo.project_person_stakeholder, qapo.artifact_evaluation, spo.artifact]
    relations:
      [qapo.stakeholder_performed_artifact_evaluation, spo.participates_in,
       spo.activity_creates_artifact]
    expected_query_type: aggregate
    rationale: >
      É a pergunta dos grupos (US3). Declara a população — só pessoas com ao menos uma
      aresta — e o critério — sentido nenhum, isto é, componente fraco. Pessoa sem aresta
      não é grupo de tamanho 1, e sem essa restrição todo grupo de 1 seria uma pessoa
      apontada (seguranca.md R2 item 4).
