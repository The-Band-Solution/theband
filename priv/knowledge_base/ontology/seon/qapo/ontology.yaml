ontology:
  id: qapo
  name: Quality Assurance Process Ontology
  acronym: QAPO
  version: 1.0.0
  namespace: the_band.ontology.seon.qapo
  layer: domain
  network: seon
  description:
    pt-BR: >
      Atividades, artefatos e stakeholders do processo de garantia da qualidade,
      avaliando a aderência de processos e produtos aos requisitos aplicáveis.
dependencies: [ufo, spo]
modules:
  - quality_assurance_process
  # Extensão do projeto: as duas relações que a QAPO publicada deixa implícitas — quem
  # avaliou e o que foi avaliado. Ver o cabeçalho do módulo.
  - evaluation_participation
  # Extensão do projeto: a posição que o avaliador tomou. A QAPO publicada descreve a
  # avaliação, o critério e o registro de não conformidade — e não declara veredito. Sem
  # ele, toda medida sobre revisão ficaria presa ao enum de um forjador.
  - evaluation_verdict
provenance:
  source_type: reference_ontology
  reference: "Tese, Seção 2.2.2.4, Figura 20"
  authors: ["Ruy, F. B."]
  year: 2017
