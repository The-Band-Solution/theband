ontology:
  id: rsro
  name: Reference Software Requirements Ontology
  acronym: RSRO
  version: 1.0.0
  namespace: the_band.ontology.seon.rsro
  layer: domain
  network: seon
  description:
    pt-BR: >
      Requisitos de software entendidos como objetivos a alcançar, a distinção
      entre requisitos funcionais e não funcionais, e como requisitos são
      documentados em artefatos próprios.
dependencies: [ufo, spo]
modules:
  - requirements
provenance:
  source_type: reference_ontology
  reference: "Tese, Seção 2.2.3, Figura 22"
  authors: ["Falbo, R. A.", "Nardi, J. C."]
  year: 2008
