module:
  id: smpo.project_planning
  ontology: smpo
  name: Project Planning
  version: 0.1.0
  description:
    pt-BR: >
      O horizonte que a organização declara para planejar trabalho, o trimestre como
      espécie dele, e a alocação de um item de trabalho a um horizonte. A alocação é
      RELATOR e nunca booleano: "está no Q3?" perde quem alocou e quando, e é justamente
      isso que permite ver replanejamento.
    en: >
      The horizon that the organization declares for planning work, the quarter as a kind of
      horizon, and the allocation of a work item to a horizon. The allocation is a RELATOR
      and never a boolean: "is it in Q3?" loses who allocated and when, and that is
      precisely what makes replanning visible.
  provenance:
    source_type: project_decision
    reference: "Issue #514; a lacuna medida em 2026-08-26"
    year: 2026

concepts:
  - id: smpo.planning_horizon
    name: Planning Horizon
    label: { pt-BR: "Horizonte de Planejamento", en: "Planning Horizon" }
    definition:
      pt-BR: >
        Período que a organização DECLARA para organizar trabalho à frente. É objeto
        social: existe porque alguém convencionou que aquele intervalo tem nome e serve
        para planejar — o mesmo intervalo não é horizonte em outra organização, e nenhuma
        das duas está errada.

        NÃO é processo executado. `sro.sprint` é `complex_action`: o trabalho acontece
        DENTRO dele, e ele termina tendo produzido um entregável. Um horizonte não é
        executado nem produz coisa alguma — ele diz para quando o trabalho havia sido
        pensado, e continua existindo mesmo que nada tenha sido feito.
      en: >
        Period that the organization DECLARES for organizing work ahead. It is a social
        object: it exists because someone agreed that that interval has a name and serves
        for planning — the same interval is not a horizon in another organization, and
        neither of the two is wrong.

        It is NOT a performed process. `sro.sprint` is a `complex_action`: the work happens
        WITHIN it, and it ends having produced a deliverable. A horizon is neither performed
        nor produces anything — it says by when the work had been intended, and it continues
        to exist even if nothing was done.
    classification: { ufo_category: social_object, ontouml_stereotype: kind }
    provenance:
      source_type: project_decision
      reference: "Issue #514 — decisão da pessoa mantenedora em 2026-08-26"
      year: 2026
      note: >
        Este conceito NÃO vem da literatura. Procurado antes de ser criado: a SPMO da
        SEON, que é a camada de planejamento, tem 17 conceitos de estimativa e
        rastreamento e nenhum de período. O único termo publicado para a caixa é o
        *Program Increment* do SAFe, e adotá-lo importaria um método que esta
        organização não pratica.

        Existe como pai para que o trimestre não seja a única forma possível de horizonte
        macro. **O segundo caso ainda não foi observado**: nesta base, os campos de
        iteração são `Quarter` (média 84 dias), `Sprint` e `Iteration` (média 13). Quando
        aparecer um semestre ou um PI, ele entra como irmão do trimestre sem mexer no que
        já existe — e é isso que o pai compra.
    attributes:
      - { name: title, type: string, required: true }
      - { name: starts_on, type: date, required: false, description: "Ausente quando a origem não declara — nunca preenchido por inferência." }
      - { name: ends_on, type: date, required: false }
    identity_criterion:
      form: external
      components: [tenant_id, source_system, source_instance, source_external_id]
      nullable_components: []
      inherited_by_subtypes: true
      note: >
        A identidade vem da origem, como em `sro.sprint`: o horizonte é coletado do campo
        de iteração do Projects v2, e renomeá-lo não cria horizonte novo.
    examples: ["Quarter 3 de 2026", "H1 2027"]

  - id: smpo.planning_quarter
    name: Planning Quarter
    label: { pt-BR: "Trimestre de Planejamento", en: "Planning Quarter" }
    definition:
      pt-BR: >
        Horizonte de planejamento de aproximadamente três meses. É o horizonte MACRO desta
        organização: medido em 2026-08-26, os 27 trimestres coletados vão de 61 a 92 dias,
        com média de 84 — contra 13 dias de média dos 171 sprints.

        A duração não é o critério de identidade, e sim consequência: o que faz um
        trimestre ser trimestre é a organização tê-lo declarado como horizonte macro, e
        não o número de dias. Um trimestre encurtado continua sendo o trimestre.
      en: >
        Planning horizon of approximately three months. It is this organization's MACRO
        horizon: measured on 2026-08-26, the 27 collected quarters range from 61 to 92 days,
        with an average of 84 — against an average of 13 days for the 171 sprints.

        Duration is not the identity criterion, but a consequence: what makes a quarter a
        quarter is that the organization declared it as the macro horizon, and not the
        number of days. A shortened quarter is still the quarter.
    classification: { ufo_category: social_object, ontouml_stereotype: subkind, parent: smpo.planning_horizon }
    provenance:
      source_type: project_decision
      reference: "Issue #514; duração conferida contra o SAFe Program Increment"
      year: 2026
      note: >
        A duração medida — 61 a 92 dias, média 84 — cai dentro da caixa de 8 a 12 semanas
        que o SAFe define para o *Program Increment*, e que organizações costumam alinhar
        ao trimestre fiscal. A coincidência confirma a escala; o nome não foi tomado
        emprestado.
    examples: ["Quarter 1", "Q3/2026"]

  - id: smpo.planning_allocation
    name: Planning Allocation
    label: { pt-BR: "Alocação de Planejamento", en: "Planning Allocation" }
    definition:
      pt-BR: >
        Vínculo entre um item de trabalho e o horizonte para o qual ele foi planejado,
        com quem alocou e quando.

        É RELATOR, e não booleano: "esta issue está no Q3?" responde sim ou não e perde as
        perguntas que importam — quando entrou, quem pôs, se saiu de outro horizonte. É
        essa perda que apaga o replanejamento, que é o fato mais informativo do
        planejamento macro.

        Alocar a um horizonte é independente de executar num sprint: medido em 2026-08-26,
        **639 issues** estão ao mesmo tempo num trimestre e num sprint. As duas caixas não
        competem — respondem perguntas diferentes sobre a mesma issue.
      en: >
        Link between a work item and the horizon for which it was planned, with who
        allocated it and when.

        It is a RELATOR, and not a boolean: "is this issue in Q3?" answers yes or no and
        loses the questions that matter — when it got in, who put it there, whether it left
        another horizon. It is that loss that erases replanning, which is the most
        informative fact of macro planning.

        Allocating to a horizon is independent of performing in a sprint: measured on
        2026-08-26, **639 issues** are at the same time in a quarter and in a sprint. The
        two boxes do not compete — they answer different questions about the same issue.
    classification: { ufo_category: relator, ontouml_stereotype: relator }
    attributes:
      - { name: allocated_at, type: datetime, required: false }
      - { name: removed_at, type: datetime, required: false, description: "Sair do horizonte MARCA, e nunca apaga: sem isto, replanejamento é indistinguível de nunca ter sido planejado." }
    identity_criterion:
      form: composite_hash
      components: [tenant_id, work_item_id, planning_horizon_id, allocated_at]
      nullable_components: [allocated_at]
      inherited_by_subtypes: true
      note: >
        `allocated_at` entra na identidade porque o mesmo item pode voltar ao mesmo
        horizonte depois de ter saído, e as duas alocações são fatos distintos.
    examples: ["a issue #412 alocada ao Quarter 3 em 2026-06-30 por quem planeja"]

relations:
  - id: smpo.allocation_mediates_item
    name: allocates
    label: { pt-BR: "aloca", en: "allocates" }
    source: smpo.planning_allocation
    target: spo.artifact
    type: materialization
    cardinality: { source: many, target: one }
    semantics:
      description: >
        O relator conecta um item de trabalho — a issue promovida, artefato do processo —
        ao horizonte. O alvo é `spo.artifact` e não `sro.user_story` porque nem todo item
        alocado a um trimestre foi promovido a user story: medido na #514, o trimestre
        recebe issue de qualquer tipo.

  - id: smpo.allocation_mediates_horizon
    name: allocates to
    label: { pt-BR: "aloca para", en: "allocates to" }
    source: smpo.planning_allocation
    target: smpo.planning_horizon
    type: materialization
    cardinality: { source: many, target: one }

  - id: smpo.sprint_overlaps_horizon
    name: overlaps
    label: { pt-BR: "sobrepõe", en: "overlaps" }
    source: sro.sprint
    target: smpo.planning_horizon
    type: association
    cardinality: { source: many, target: many }
    temporal:
      type: historical_relation
    semantics:
      description: >
        Sobreposição temporal OBSERVADA entre a execução e o horizonte — nunca contenção
        mereológica, e a diferença foi medida.

        Dos 135 sprints que coincidem no tempo com um trimestre do mesmo quadro em
        2026-08-26, **104 ficam dentro e 31 atravessam a fronteira** — 23%. Declarar
        `part_whole` tornaria esses 31 impossíveis de representar, e a plataforma teria de
        escolher um trimestre para eles, que é escolher pela organização.

        A cardinalidade `many`/`many` diz o resto: um sprint pode não coincidir com
        horizonte algum, e um horizonte pode existir sem sprint nenhum dentro dele.
