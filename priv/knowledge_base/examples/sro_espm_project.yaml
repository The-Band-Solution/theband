  ontology: sro
  description:
    pt-BR: >
      Instanciação da SRO com dados de um projeto real, usada na validação da
      ontologia na tese. Serve como fixture de teste e material de onboarding.
  provenance:
    source_type: thesis
    reference: "Tese, Tabela 2 — Validação da SRO"
    note: Nomes de participantes reduzidos a iniciais na fonte original.

