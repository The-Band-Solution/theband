# Repositórios de uma organização, com o que qualquer hospedagem de Git fornece.
#
# `pushedAt` e `archivedAt` vêm juntos porque as duas datas respondem coisas
# diferentes: a primeira é atividade, a segunda é fato da origem — e nenhuma das duas
# é "não mais observado", que é inferência da plataforma.
#
# `primaryLanguage` é calculada pela origem sobre o código. O mapeamento declara essa
# atribuição em vez de presumi-la.
query($organization: String!, $page_size: Int = 50, $after: String) {
  rateLimit { cost remaining resetAt }

  organization(login: $organization) {
    id
    repositories(first: $page_size, after: $after, orderBy: {field: NAME, direction: ASC}) {
      # `totalCount` é o denominador do progresso. Sem ele a barra teria de inventar o
      # total, e um percentual sobre denominador inventado é número que parece
      # informação e não é.
      totalCount
      pageInfo { hasNextPage endCursor }
      nodes {
        id
        name
        nameWithOwner
        url
        description
        archivedAt
        createdAt
        pushedAt
        # A ATIVIDADE DE ISSUE MAIS RECENTE — o sinal do corte das issues.
        #
        # `pushedAt` responde "houve push de código", e **atividade de issue não é push**:
        # abrir, fechar, comentar e apagar não mexem naquela data. Medido em 2026-09-09:
        # `plataformas-project` tinha push de 21/jul e issue fechada **no mesmo dia da
        # medição** — o corte pulava o repositório desde julho, e as 712 issues dele
        # estavam congeladas.
        #
        # `updatedAt` do repositório **também não serve**, e foi medido: nos dois
        # repositórios ele estava MAIS ANTIGO que o `pushedAt` (28/abr e 03/set). Trocar
        # um pelo outro teria piorado o corte com o teste continuando verde.
        #
        # `last: 1` com ordem ASC devolve a issue mais recentemente atualizada — o próprio
        # fato que a pergunta faz, e não um proxy dele. Vem **nesta consulta**, então não
        # custa requisição nenhuma.
        issues(last: 1, orderBy: { field: UPDATED_AT, direction: ASC }) {
          nodes { updatedAt }
        }
        primaryLanguage { name }
        defaultBranchRef { name }
        owner { id }
      }
    }
  }
}
