# As solicitações de mudança de um repositório, com os commits de cada uma — feature 032.
#
# **Uma consulta, dois níveis**, e a razão é volume: medido em 2026-08-18, quatro
# repositórios do piloto somam 822 PRs e 1.202 commits, e a organização tem 121. Coletar
# commits ATRAVÉS do PR mantém o rastro e evita percorrer a história inteira de cada
# repositório. O preço é que commit fora de PR não é alcançado — limitação declarada.
#
# `pullRequests` NÃO aceita filtro por data, ao contrário de `issues`. O incremental é
# feito parando cedo: a ordenação é UPDATED_AT decrescente, e a ingestão encerra a
# paginação no primeiro PR mais antigo que o checkpoint do repositório.
#
# `closingIssuesReferences` é o vínculo com escopo, e é o que a ORIGEM reconheceu — não o
# que o corpo do PR parece dizer. Medido em 2026-08-17: um PR com quatorze issues em
# `Closes #411 #412 …` teve UMA reconhecida.
#
# `authors` no plural, e é essencial: todo commit deste repositório tem dois autores (o
# trailer Co-Authored-By). `author` no singular atribuiria a mudança a uma pessoa quando o
# registro nomeia duas.
#
# Os dois `totalCount` existem para truncamento nunca ser silencioso.
query($owner: String!, $name: String!, $page_size: Int = 25, $commit_size: Int = 50, $review_size: Int = 30, $after: String) {
  rateLimit { cost remaining resetAt }

  repository(owner: $owner, name: $name) {
    id
    pullRequests(first: $page_size, after: $after, orderBy: {field: UPDATED_AT, direction: DESC}) {
      totalCount
      pageInfo { hasNextPage endCursor }
      nodes {
        id
        number
        title
        # bodyText e não body: texto plano, como no corpo da issue e do comentário.
        bodyText
        state
        createdAt
        updatedAt
        mergedAt
        closedAt
        changedFiles
        headRefName
        baseRefName
        author { __typename login ... on User { id } }
        mergedBy { __typename login ... on User { id } }

        closingIssuesReferences(first: 20) {
          totalCount
          nodes { id number }
        }

        # As reviews vêm AQUI e não em consulta própria: o mapeamento
        # `github.pull_request_review.to.qapo.artifact_evaluation` estava escrito desde a
        # versão 1 e nunca foi coletado, e trazê-las junto custa zero requisição a mais.
        #
        # `reviews` e não `reviewThreads`: a limitação do mapeamento é explícita — "um
        # comentário isolado não é uma review; usar apenas eventos de review submetida".
        # Thread traz comentário solto, e contá-lo inflaria a contagem de avaliações.
        #
        # `submittedAt` é o instante que a medida `review_time_to_first_review_duration`
        # pede. `state` distingue APPROVED de CHANGES_REQUESTED — e a limitação diz que
        # aprovar não é ausência de não conformidade, apenas ausência de bloqueio.
        #
        # `author.__typename` existe para separar bot de pessoa: a outra limitação do
        # mapeamento manda classificá-las separadamente, e sem o tipo a plataforma
        # contaria revisão automática como revisão humana.
        reviews(first: $review_size) {
          totalCount
          pageInfo { hasNextPage endCursor }
          nodes {
            id
            state
            submittedAt
            bodyText
            author { __typename login ... on User { id } }
          }
        }

        # O ESTADO DA VERIFICAÇÃO DO COMMIT QUE ENTROU — a pergunta da máxima `ci.ap03`.
        #
        # `commits(last: 1)` é a ponta do ramo no momento do merge, e é ela que interessa: a
        # máxima fala de "integrado com verificação vermelha", e o que foi integrado é a ponta,
        # não todos os commits que passaram pelo ramo.
        #
        # `statusCheckRollup` é campo do **commit**, não do PR, e agrega as duas camadas que a
        # coleta de `workflow_run` não alcança: os `check_run` da API de Checks e os `status` da
        # API antiga, postos por serviço externo.
        #
        # **Por que isto responde o que o casamento por SHA não respondia:** a execução coletada
        # tem `head_sha` = ponta do ramo NAQUELE instante. Ramo que recebeu mais commits depois
        # deixa aquela execução apontando para um SHA que não é mais a ponta — e o casamento só
        # acha execução para os commits que foram ponta em algum push. Medido em 2026-08-19: 98
        # das 415 solicitações de uma pessoa caíam nesse buraco, e eu as chamava de
        # "não dá para saber".
        #
        # E `state` nulo com zero contextos **não é desconhecimento**: é nenhum check ter
        # rodado, que é fato sobre o processo. Conferido em `ifesserra-lab/egressos#18`.
        pontaVerificada: commits(last: 1) {
          nodes {
            commit {
              oid
              statusCheckRollup {
                state
                contexts(first: 20) {
                  totalCount
                  nodes {
                    __typename
                    # `CheckRun` vem do Actions e de apps; `StatusContext` da API antiga. Os dois
                    # nomeiam a verificação de formas diferentes, e guardar o `__typename` é o
                    # que permite dizer de qual camada o resultado veio.
                    ... on CheckRun { name conclusion status }
                    ... on StatusContext { context state }
                  }
                }
              }
            }
          }
        }

        commits(first: $commit_size) {
          totalCount
          # O cursor existe para a paginação dos truncados: sem ele, "não coletado" seria
          # limitação nossa em vez de fato sobre a origem.
          pageInfo { hasNextPage endCursor }
          nodes {
            commit {
              oid
              messageHeadline
              messageBody
              committedDate
              additions
              deletions
              changedFilesIfAvailable
              authors(first: 10) {
                nodes {
                  name
                  email
                  user { login id }
                }
              }
            }
          }
        }
      }
    }
  }
}
