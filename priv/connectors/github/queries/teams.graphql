# github.teams — times da organização.
# repositories e projectsV2 são pedidos para decidir entre equipe organizacional
# e equipe de projeto: quando vazios, não há como distinguir pelos dados, e o
# alvo permanece eo.organizational_team.
query($organization: String!, $page_size: Int!, $after: String) {
  rateLimit { cost remaining resetAt }
  organization(login: $organization) {
    id
    teams(first: $page_size, after: $after) {
      pageInfo { hasNextPage endCursor }
      nodes {
        id
        name
        slug
        createdAt
        repositories(first: 1) { totalCount }
        projectsV2(first: 1) { totalCount }
      }
    }
  }
}
