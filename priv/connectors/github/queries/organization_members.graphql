# NOTA — o campo `email` foi deliberadamente omitido.
# Pedi-lo exigiria o escopo read:user ou user:email, mais amplo do que a
# coleta precisa, para um campo que o próprio mapeamento declara como
# normalmente nulo por configuração de privacidade. O escopo requerido
# permanece read:org, como declara a regra github.team_membership_evidence.
# github.organization_members — pessoas com conta na organização.
# Conjunto distinto do de integrantes de times: coletar só um daria visão
# parcial sem que a pessoa usuária soubesse.
query($organization: String!, $page_size: Int!, $after: String) {
  rateLimit { cost remaining resetAt }
  organization(login: $organization) {
    id
    membersWithRole(first: $page_size, after: $after) {
      pageInfo { hasNextPage endCursor }
      nodes {
        __typename
        id
        login
        name
      }
    }
  }
}
