  rodape_como: >-
    Construída com MkDocs a partir de <span class="tb-mono">docs/</span> na
    <span class="tb-mono">main</span>. Identidade copiada de theband.dev em {data_copia}. Cada página
    tem o link para editá-la no GitHub.
