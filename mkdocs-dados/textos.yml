# Os textos da moldura do site, nos dois idiomas.
#
# Por que aqui, e não nos templates: o mesmo template serve aos dois builds (o
# plugin de idiomas constrói o site duas vezes), e a frase em inglês precisa de
# um lugar só para ser revisada pelo lote L01 de traducao.md. A chave é o
# idioma do build, `pt` ou `en`.
